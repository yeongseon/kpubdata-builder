openapi: 3.1.0
info:
  title: KPubData Builder Service API
  version: "1.6.0"
  description: >-
    Builder 중심 서비스 계약. BuildSpec 검증, preview, build 실행, artifact 조회,
    계약 버전 조회를 제공한다. CLI와 HTTP service mode(#36)가 동일한 도메인 계약을
    공유한다. 본 문서는 BuilderService(service/app.py)의 dispatch 라우팅과 실제
    wire 형태를 기계 판독용(OpenAPI 3.1) 단일 소스로 고정하며, Studio 같은 소비자가
    타입 클라이언트를 생성하는 기준이 된다. v0.4에서는 동기식 build만 유지하며
    비동기/publish 엔드포인트는 제외된다(ADR 0002, #226). v1.6.0은 built dataset
    품질 결과 요약과 run별 quality/schema drift history API를 추가한다(#486,
    additive — 기존 엔드포인트는 변경되지 않는다).
servers:
  - url: http://localhost:8000
    description: 로컬 builder 개발 서버

security:
  - ApiKeyAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: 무인증 liveness probe (버전·메타 정보 없이 status만)
      security: []
      responses:
        "200":
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      operationId: getVersion
      summary: Builder API 계약 버전 조회
      responses:
        "200":
          description: 서비스/계약 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /catalog:
    get:
      operationId: getCatalog
      summary: provider/dataset 카탈로그 조회 (BL2, #416)
      responses:
        "200":
          description: 사용 가능한 provider와 dataset 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: 카탈로그 조회 실패

  /validate:
    post:
      operationId: validateSpec
      summary: BuildSpec 검증 (동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecRequest"
      responses:
        "200":
          description: 검증 통과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          description: spec 파싱 실패 또는 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /preview:
    post:
      operationId: previewBuild
      summary: 각 소스의 스키마와 샘플 행 산출 (파일 미기록, 동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: preview 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, limit 타입 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /build:
    post:
      operationId: createBuild
      summary: 파이프라인 실행 및 결과 반환 (동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
      responses:
        "200":
          description: 모든 소스 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSuccessResponse"
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, run_id 타입/경로 안전성 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: >-
            하나 이상의 소스 fetch/stage 실패. upstream 소스 의존 실패이며 매니페스트는
            partial 정책으로 남는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildFailureResponse"

  /artifacts/{run_id}:
    get:
      operationId: listBuildArtifacts
      summary: 실행 워크스페이스의 산출물 파일 목록 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: artifact 파일 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsResponse"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/manifest:
    get:
      operationId: getBuildManifest
      summary: 실행 워크스페이스의 manifest.json 본문 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: manifest.json 본문
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildManifest"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 해당 run 또는 manifest를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: manifest 파일을 읽거나 JSON으로 해석할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/spec:
    get:
      operationId: getBuildSpecSnapshot
      summary: 실행에 사용한 canonical BuildSpec snapshot 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: redaction된 canonical buildspec.yaml 본문과 SHA-256 digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSpecSnapshotResponse"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run이 없거나 legacy run에 snapshot이 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: snapshot 파일을 읽거나 UTF-8로 해석할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds:
    get:
      operationId: listBuilds
      summary: "빌드 이력 목록 조회 (최신 수정 시각 기준 내림차순)"
      parameters:
        - name: limit
          in: query
          required: false
          description: "반환할 최대 빌드 수 (기본값: 50)"
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: 빌드 이력 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildsResponse"
        "400":
          description: 잘못된 limit 파라미터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /datasets:
    get:
      operationId: listDatasets
      summary: >-
        Built dataset 목록 조회 (dataset_id별 grouping, #488). 동일 dataset_id의
        여러 run을 접근 가능한 latest run 기준으로 하나의 dataset으로 묶는다.
        buildspec.yaml snapshot이 없는 legacy run은 grouping 대상에서 제외된다.
      parameters:
        - name: limit
          in: query
          required: false
          description: "반환할 최대 dataset 수 (기본값: 50)"
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: built dataset 목록 (latest run 기준 요약)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetsResponse"
        "400":
          description: 잘못된 limit 파라미터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /datasets/{dataset_id}:
    get:
      operationId: getDataset
      summary: 단일 built dataset의 canonical 요약 조회 (latest accessible run 기준, #488)
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: dataset 요약 (title/sources/latest run/row_counts/stage 상태 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetailResponse"
        "400":
          description: dataset_id가 비어 있음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            접근 가능한 run이 없는 dataset_id. dataset_id가 실제로 존재하지 않는
            경우와 타 사용자 소유 run만 있는 경우를 구분해 노출하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /datasets/{dataset_id}/runs:
    get:
      operationId: listDatasetRuns
      summary: dataset_id의 접근 가능한 run history 조회 (최신순, #488)
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: limit
          in: query
          required: false
          description: "반환할 최대 run 수 (기본값: 50)"
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: dataset의 run history (newest first, 타 사용자 run 제외)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRunsResponse"
        "400":
          description: dataset_id가 비어 있거나 limit이 잘못됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 접근 가능한 run이 없는 dataset_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /datasets/{dataset_id}/quality/history:
    get:
      operationId: listDatasetQualityHistory
      summary: dataset_id의 구조화된 quality/schema drift history 조회 (#486)
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: limit
          in: query
          required: false
          description: "반환할 최대 run 수 (기본값: 50)"
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: dataset의 quality history (newest first, 타 사용자 run 제외)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetQualityHistoryResponse"
        "400":
          description: dataset_id가 비어 있거나 limit이 잘못됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 접근 가능한 run이 없는 dataset_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/stages:
    get:
      operationId: listBuildStages
      summary: run에 알려진 모든 source의 Bronze/Silver/Gold 상태 조회 (#488)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: source별 Bronze/Silver/Gold 상태 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStagesResponse"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/stages/{stage}:
    get:
      operationId: getBuildStageDetail
      summary: >-
        단일 source의 단일 stage(bronze/silver/gold)에 대한 안전한 summary/preview
        조회 (#488). raw fetch_params, export options, credential, 절대 경로는
        어디에도 담기지 않는다. Silver sample은 build 시점에 이미 persist된 상한
        (기본 5행) 안에서만 반환되며 parquet 전체를 읽지 않는다.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Stage"
        - name: source
          in: query
          required: true
          description: 조회할 source_key (run에 알려진 source여야 함)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Silver sample 행 수 상한 (기본값: 5, 다른 stage에서는 무시됨)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 5
      responses:
        "200":
          description: stage summary/preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageDetailResponse"
        "400":
          description: >-
            경로 안전하지 않은 run_id/source, 잘못된 stage 이름, source 누락,
            또는 잘못된 limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run이 없거나, source가 이 run에 알려지지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        서버에 KPUBDATA_BUILDER_API_KEY가 설정된 경우 필수. 미설정 시(로컬 개발 기본값)
        인증 없이 모든 요청이 허용된다 (#248).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Google OIDC ID 토큰 (ADR 0009). Authorization: Bearer <jwt>.
        OIDC_ISSUER 미설정 시 비활성 — 기존 ApiKeyAuth 배포에 영향 없음 (#385).

  responses:
    Unauthorized:
      description: X-API-Key가 누락되었거나 서버에 설정된 키와 일치하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: build 실행 식별자(경로 안전한 단일 세그먼트)
      schema:
        type: string

    DatasetId:
      name: dataset_id
      in: path
      required: true
      description: >-
        BuildSpec.dataset_id 값. slash/space 등 경로에 그대로 쓸 수 없는 문자를
        포함할 수 있으므로 클라이언트는 percent-encoding해야 한다(#488).
      schema:
        type: string

    Stage:
      name: stage
      in: path
      required: true
      description: 조회할 medallion stage
      schema:
        type: string
        enum: [bronze, silver, gold]

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 사람이 읽는 오류 요약 메시지

    ValidationError:
      type: object
      description: >-
        validate/build/preview의 spec 검증 실패 응답. SpecLoadError는
        {status:"error", error}, ValidationError는 {status:"invalid", problems}로
        나뉜다.
      required: [status]
      properties:
        status:
          type: string
          enum: [error, invalid]
        error:
          type: string
          description: status=error일 때의 파싱 오류 메시지
        problems:
          type: array
          description: status=invalid일 때의 검증 문제 목록
          items:
            type: string

    JsonValue:
      description: 표준 JSON으로 직렬화 가능한 값(null, scalar, array, object)
      type: [string, number, boolean, object, array, "null"]
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      items:
        $ref: "#/components/schemas/JsonValue"

    BuildSpec:
      type: object
      description: >-
        선언적 빌드 명세(snake_case). dataset_id/title/description/sources/exports는
        필수이고 나머지 필드는 선택이다. 세부 스키마는 spec 모델
        (spec/models.py)을 따른다. 제거된 transforms/normalization_mode 필드는
        허용하지 않는다.
      additionalProperties: true
      allOf:
        - not:
            required: [transforms]
        - not:
            required: [normalization_mode]
      required: [dataset_id, title, description, sources, exports]
      properties:
        dataset_id:
          type: string
        title:
          type: string
        description:
          type: string
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        exports:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExportTarget"
        metadata:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        publish:
          type: boolean
          default: false
        splits:
          oneOf:
            - $ref: "#/components/schemas/SplitSpec"
            - type: "null"
        pii:
          oneOf:
            - $ref: "#/components/schemas/PiiPolicy"
            - type: "null"
        license:
          type: [string, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/QualityPolicy"
            - type: "null"

    SourceRef:
      type: object
      description: >-
        kpubdata provider/dataset 참조. 제거된 normalization_mode 필드는 허용하지
        않으며 정규화와 검증은 schema 계약으로 선언한다.
      additionalProperties: true
      not:
        required: [normalization_mode]
      required: [provider, dataset]
      properties:
        provider:
          type: string
        dataset:
          type: string
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        alias:
          type: string
          default: ""
        schema:
          oneOf:
            - $ref: "#/components/schemas/SchemaContract"
            - type: "null"

    SchemaContract:
      type: object
      description: Silver 정규화 및 required-column/dtype 검증 계약
      properties:
        required:
          type: array
          items:
            type: string
          default: []
        dtypes:
          type: object
          additionalProperties:
            type: string
          default: {}
        casts:
          type: object
          additionalProperties:
            type: string
          default: {}

    ExportTarget:
      type: object
      required: [kind, output_path]
      properties:
        kind:
          type: string
        output_path:
          type: string
        options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"

    SplitSpec:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ratio, key]
        ratios:
          type: object
          additionalProperties:
            type: number
          default: {}
        key:
          type: string
          default: ""
        seed:
          type: integer
          default: 0

    PiiPolicy:
      type: object
      properties:
        mode:
          type: string
          enum: [block, warn, allow]
          default: block
        allow_columns:
          type: array
          items:
            type: string
          default: []

    QualityPolicy:
      type: object
      properties:
        max_duplicate_rate:
          type: [number, "null"]
        max_null_ratio:
          type: object
          additionalProperties:
            type: number
          default: {}
        min_rows:
          type: [integer, "null"]

    SpecRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열

    PreviewRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        limit:
          type: integer
          minimum: 1
          default: 5

    BuildRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        run_id:
          type: string
          description: 명시 시 비어있지 않은 경로 안전한 단일 세그먼트여야 한다

    VersionResponse:
      type: object
      required: [service, api_version]
      properties:
        service:
          type: string
        api_version:
          type: string

    HealthResponse:
      type: object
      required: [status]
      description: liveness probe 응답 (버전·메타 정보 없이 status만, #372)
      properties:
        status:
          type: string
          const: "ok"

    CatalogResponse:
      type: object
      required: [providers]
      description: provider/dataset 카탈로그 (#416, BL2)
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProvider"

    CatalogProvider:
      type: object
      required: [name, datasets]
      properties:
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDataset"

    CatalogDataset:
      type: object
      required: [name, title, requires_service_key]
      properties:
        name:
          type: string
        title:
          type: string
        requires_service_key:
          type: boolean

    StructuredProblem:
      type: object
      required: [code, path, message]
      description: 구조화된 검증 문제 (#417, BL3)
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string
        hint:
          type: string
          nullable: true

    ValidateResponse:
      type: object
      required: [status, dataset_id, api_version]
      properties:
        status:
          type: string
          enum: [valid]
        dataset_id:
          type: string
        api_version:
          type: string

    PreviewResponse:
      type: object
      required: [dataset_id, previews]
      properties:
        dataset_id:
          type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/SourcePreview"

    SourcePreview:
      type: object
      required: [source_key, status, error, schema, sample, total_rows, statistics]
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        error:
          type: [string, "null"]
        schema:
          type: array
          items:
            type: object
            required: [name, dtype, nullable, unique_count]
            properties:
              name:
                type: string
              dtype:
                type: string
              nullable:
                type: boolean
              unique_count:
                type: integer
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        total_rows:
          type: integer
        statistics:
          $ref: "#/components/schemas/TableStatistics"

    TableStatistics:
      type: object
      required: [row_count, null_counts, duplicate_rate]
      properties:
        row_count:
          type: integer
        null_counts:
          type: object
          additionalProperties:
            type: integer
        duplicate_rate:
          type: number

    BuildOutcome:
      type: object
      required: [source_key, status, stages_completed, error]
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        stages_completed:
          type: array
          items:
            type: string
        error:
          type: [string, "null"]

    BuildSuccessResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        manifest:
          type: string
          description: 기록된 manifest.json의 경로
        api_version:
          type: string

    BuildFailureResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version, error]
      properties:
        status:
          type: string
          enum: [failed]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        manifest:
          type: string
          description: partial 정책으로 남은 manifest.json의 경로
        api_version:
          type: string
        error:
          type: string
          description: 첫 번째 실패 outcome의 error에서 파생된 human-readable 요약 (#226)

    ArtifactsResponse:
      type: object
      required: [run_id, files]
      properties:
        run_id:
          type: string
        files:
          type: array
          items:
            type: string
            description: run 디렉터리 기준 상대 파일 경로

    BuildManifest:
      type: object
      required: [build_id, started_at, finished_at, schema_version]
      additionalProperties: true
      properties:
        build_id:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        schema_version:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        row_counts:
          type: object
          additionalProperties:
            type: integer
        quality_results:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SourceQualityResult"
        schema_drift:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SourceSchemaDrift"
        inputs_fingerprint:
          type: [string, "null"]
        created_by:
          type: [string, "null"]

    BuildSpecSnapshotResponse:
      type: object
      required: [run_id, spec, spec_digest]
      additionalProperties: false
      properties:
        run_id:
          type: string
        spec:
          type: string
          description: credential 값이 redaction된 canonical YAML
        spec_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            실제 저장된 redaction 후 canonical buildspec.yaml bytes의 SHA-256.
            credential 값만 다른 spec은 같은 digest가 될 수 있다.

    BuildSummary:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          description: 빌드 실행 식별자
        status:
          type: string
          enum: [ok, failed]
          description: 빌드 상태
        started_at:
          type: [string, "null"]
          description: 빌드 시작 시각 (ISO 8601 또는 null)
        finished_at:
          type: [string, "null"]
          description: 빌드 완료 시각 (ISO 8601 또는 null)

    BuildsResponse:
      type: object
      required: [builds]
      properties:
        builds:
          type: array
          items:
            $ref: "#/components/schemas/BuildSummary"

    # ---------------------------------------------------------------------
    # Dataset Catalog / Stage Summary API (#488)
    # ---------------------------------------------------------------------

    DatasetSourceRef:
      type: object
      description: dataset의 canonical snapshot에 선언된 소스 참조 (secret 없음)
      required: [provider, dataset, alias]
      properties:
        provider:
          type: string
        dataset:
          type: string
        alias:
          type: string

    StageStatusValue:
      type: string
      description: >-
        completed(완전한 산출물 존재) / failed(manifest에 실패로 기록됨) /
        not_run(상위 단계가 끝나지 못해 시도되지 않음) / unavailable(디렉터리는
        있지만 불완전·손상됨, legacy 형식 등)
      enum: [completed, failed, not_run, unavailable]

    DatasetStageMap:
      type: object
      description: source_key → {bronze, silver, gold} 상태 맵
      additionalProperties:
        type: object
        required: [bronze, silver, gold]
        properties:
          bronze:
            $ref: "#/components/schemas/StageStatusValue"
          silver:
            $ref: "#/components/schemas/StageStatusValue"
          gold:
            $ref: "#/components/schemas/StageStatusValue"

    QualityCheckResult:
      type: object
      required: [name, status, observed, threshold, column, message]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [pass, warn]
        observed:
          $ref: "#/components/schemas/JsonValue"
        threshold:
          $ref: "#/components/schemas/JsonValue"
        column:
          type: [string, "null"]
        message:
          type: string

    SourceQualityResult:
      type: object
      required: [source_key, status, checks]
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [pass, warn]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/QualityCheckResult"

    DatasetQualitySummary:
      type: object
      required: [status, sources]
      properties:
        status:
          type: string
          enum: [pass, warn]
        sources:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/SourceQualityResult"

    SchemaDriftFinding:
      type: object
      required: [kind, column, detail]
      properties:
        kind:
          type: string
        column:
          type: [string, "null"]
        detail:
          type: string

    SourceSchemaDrift:
      type: object
      required: [source_key, findings]
      properties:
        source_key:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/SchemaDriftFinding"

    DatasetSchemaDriftMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/SourceSchemaDrift"

    DatasetSummary:
      type: object
      description: >-
        동일 dataset_id를 공유하는 여러 run을 접근 가능한 latest run 기준으로
        묶은 built dataset 요약. latest run manifest에 구조화된 quality 결과가
        있으면 요약하고, 없는 legacy/미평가 run은 null로 둔다.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
          description: latest run의 finished_at(없으면 started_at)
        row_counts:
          type: object
          description: >-
            source_key별 Silver row_count. multi-source dataset을 단일 값으로
            축약하지 않는다.
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
          description: row_counts 값의 합계
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          oneOf:
            - $ref: "#/components/schemas/DatasetQualitySummary"
            - type: "null"

    DatasetDetailResponse:
      type: object
      description: DatasetSummary와 동일한 필드에 run_count가 추가된 단일 dataset 상세 응답.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
        - run_count
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
        row_counts:
          type: object
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          oneOf:
            - $ref: "#/components/schemas/DatasetQualitySummary"
            - type: "null"
        run_count:
          type: integer
          description: 이 principal에게 접근 가능한 이 dataset_id의 run 총 개수

    DatasetsResponse:
      type: object
      required: [datasets]
      properties:
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"

    DatasetRunSummary:
      type: object
      required: [run_id, status, started_at, finished_at, spec_digest, created_by]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        started_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]
        spec_digest:
          type: [string, "null"]
        created_by:
          type: [string, "null"]

    DatasetRunsResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRunSummary"

    DatasetQualityHistoryEntry:
      type: object
      required: [run_id, status, started_at, finished_at, quality, schema_drift]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        started_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/DatasetQualitySummary"
            - type: "null"
        schema_drift:
          $ref: "#/components/schemas/DatasetSchemaDriftMap"

    DatasetQualityHistoryResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/DatasetQualityHistoryEntry"

    StageState:
      type: object
      required: [status, available]
      properties:
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
          description: "status == completed 의 편의 boolean"

    RunStageEntry:
      type: object
      required: [source_key, bronze, silver, gold]
      properties:
        source_key:
          type: string
        bronze:
          $ref: "#/components/schemas/StageState"
        silver:
          $ref: "#/components/schemas/StageState"
        gold:
          $ref: "#/components/schemas/StageState"

    RunStagesResponse:
      type: object
      required: [run_id, sources]
      properties:
        run_id:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RunStageEntry"

    StageDetailResponse:
      description: >-
        실제 stage 값에 따라 Bronze/Silver/Gold 상세 응답 중 하나를 반환한다.
        모든 분기는 runtime wire response의 필드를 명시하며 raw fetch_params,
        export options, credential, 절대 filesystem 경로를 노출하지 않는다.
      required: [run_id, stage, source_key, status, available]
      oneOf:
        - $ref: "#/components/schemas/BronzeStageDetailResponse"
        - $ref: "#/components/schemas/SilverStageDetailResponse"
        - $ref: "#/components/schemas/GoldStageDetailResponse"

    BronzeStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - provider
        - dataset
        - fetched_at
        - record_count
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [bronze]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        provider:
          type: [string, "null"]
        dataset:
          type: [string, "null"]
        fetched_at:
          type: [string, "null"]
        record_count:
          type: [integer, "null"]

    SilverColumnInfo:
      type: object
      additionalProperties: false
      required: [name, dtype, nullable, unique_count]
      properties:
        name:
          type: string
        dtype:
          type: string
        nullable:
          type: boolean
        unique_count:
          type: integer

    SilverValidationProblem:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
        field:
          type: [string, "null"]
        message:
          type: string

    SilverValidationResult:
      type: object
      additionalProperties: false
      required: [ok, problems]
      properties:
        ok:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/SilverValidationProblem"

    SilverStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - schema
        - statistics
        - validation
        - sample
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [silver]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        schema:
          type: array
          items:
            $ref: "#/components/schemas/SilverColumnInfo"
        statistics:
          oneOf:
            - $ref: "#/components/schemas/TableStatistics"
            - type: "null"
        validation:
          oneOf:
            - $ref: "#/components/schemas/SilverValidationResult"
            - type: "null"
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"

    GoldExportSummary:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string

    GoldStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - columns
        - splits
        - exports
        - sample
        - sample_available
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [gold]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        columns:
          type: array
          items:
            type: string
        splits:
          oneOf:
            - type: object
              additionalProperties:
                type: integer
            - type: "null"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/GoldExportSummary"
        sample:
          type: "null"
        sample_available:
          type: boolean
          enum: [false]
