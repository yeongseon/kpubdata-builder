# Deploy to OCI (single VM: app-01)
#
# ADR 0017(풀스택 배포 토폴로지)의 배포 자동화. our-tax의 split-topology
# deploy.yml(ADR-0005)에서 db-01 배포 job, Alembic migration one-shot, ETL job,
# CUBRID 관련 secret을 모두 제거한 단순화 버전이다. Builder는 외부 RDBMS 없이
# /data 볼륨만으로 상태를 영속화하므로 DB 배포/마이그레이션 단계가 없다.
#
#   1. Builder 이미지를 GHCR에 빌드/푸시 (linux/amd64, sha 태그).
#   2. SSH app-01: git pull, .env 렌더, GHCR 로그인, 이미지 pull, 컨테이너 rollout.
#      secret 은 커맨드라인이 아니라 stdin 으로만 전달한다 — 인자에 실으면 원격
#      호스트의 모든 사용자가 `ps` 로 읽는다. rollout 본문은
#      ops/deploy/app-01-rollout.sh 에 있다.
#   3. 헬스 체크는 VM 안에서 한다. 러너가 공개 포트를 찌르면 그 프로브가 곧
#      "8000 을 열어 두어야 한다"는 요구가 되고, TLS 없이 API 키가 오간다.
#
# 필요한 secret (Settings → Secrets and variables → Actions):
#
#   OCI_SSH_PRIVATE_KEY   PEM 개인키(passphrase 없음). 공개키는 app-01에 등록.
#   OCI_SSH_USER          SSH 사용자 (보통 `ubuntu` 또는 `opc`).
#   OCI_APP_HOST          app-01 SSH 접근 주소 (public IP 또는 DNS).
#   KPUBDATA_BUILDER_API_KEY          fail-closed 인증 키 (ADR 0006). 필수.
#   KPUBDATA_BUILDER_ALLOWED_ORIGINS  Studio 오리진 콤마 목록 (CORS default-deny).
#   KPUBDATA_BUILDER_CREDENTIAL_MASTER_KEY  Provider credential master key (ADR 0012).
#                                           재기동 사이 동일 값 유지 필수.
#   APP_DOMAIN            (선택) Caddy 공개 도메인. 설정하면 rollout 이 --profile
#                         caddy 로 TLS 진입까지 함께 띄운다. 미설정 시 IP-only.
#   OCI_SSH_KNOWN_HOSTS   (권장) app-01 의 고정 host key. 미설정 시 ssh-keyscan
#                         으로 폴백하는데, 그것은 trust-on-first-use 다.
#
# Triggers:
#   - push to main: 배포 관련 파일 변경 시 자동 배포.
#   - workflow_dispatch: 수동 트리거.

name: Deploy to OCI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docker-compose.prod.app.yml'
      - 'ops/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BUILDER_IMAGE: ghcr.io/${{ github.repository_owner }}/kpubdata-builder

jobs:
  # ---------------------------------------------------------------------------
  # Builder 이미지 빌드 & GHCR 푸시.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: |
          sha="${GITHUB_SHA::12}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "[build] resolved image tag: ${sha}"
          echo "[build] builder image: ${BUILDER_IMAGE}:${sha}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push builder
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.BUILDER_IMAGE }}:latest
            ${{ env.BUILDER_IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=builder
          cache-to: type=gha,scope=builder,mode=max

      - name: Summary
        run: echo "::notice title=Build complete::builder image pushed at sha=${{ steps.meta.outputs.sha }}"

  # ---------------------------------------------------------------------------
  # app-01: 새 이미지 pull, 컨테이너 rollout.
  # ---------------------------------------------------------------------------
  deploy-app:
    runs-on: ubuntu-latest
    needs: build
    # 이 job 은 저장소 내용을 읽기만 하면 된다. GITHUB_TOKEN 은 원격에서 GHCR
    # pull 과 git fetch 에 쓰이므로 packages: read 까지만 준다.
    permissions:
      contents: read
      packages: read
    # 프로덕션 배포에 승인 게이트와 환경별 secret 을 걸 수 있는 자리다.
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.OCI_SSH_KNOWN_HOSTS }}
          APP_HOST: ${{ secrets.OCI_APP_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_oci
          chmod 600 ~/.ssh/id_oci
          if [ -n "${SSH_KNOWN_HOSTS}" ]; then
            printf '%s\n' "${SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          else
            # ssh-keyscan 은 trust-on-first-use 다 — 첫 접속을 가로채는 상대의 키를
            # 그대로 신뢰한다. OCI_SSH_KNOWN_HOSTS secret 에 고정해 두는 것이 옳고,
            # 없을 때만 경고와 함께 폴백한다.
            echo "::warning title=Unpinned host key::OCI_SSH_KNOWN_HOSTS is not set; falling back to ssh-keyscan (trust-on-first-use)"
            ssh-keyscan -H "${APP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy app-01 stack
        env:
          BUILDER_TAG: ${{ needs.build.outputs.sha }}
          KPUBDATA_BUILDER_API_KEY: ${{ secrets.KPUBDATA_BUILDER_API_KEY }}
          KPUBDATA_BUILDER_ALLOWED_ORIGINS: ${{ secrets.KPUBDATA_BUILDER_ALLOWED_ORIGINS }}
          KPUBDATA_BUILDER_CREDENTIAL_MASTER_KEY: ${{ secrets.KPUBDATA_BUILDER_CREDENTIAL_MASTER_KEY }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          SSH_USER: ${{ secrets.OCI_SSH_USER }}
          APP_HOST: ${{ secrets.OCI_APP_HOST }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "[deploy-app] === START $(date -u +%FT%TZ) sha=${BUILDER_TAG} ==="
          # secret 을 원격 커맨드라인에 실으면 app-01 의 모든 사용자가 `ps` 로
          # 읽는다. 환경 대입문과 스크립트를 하나의 stdin 으로 흘려보내
          # `bash -s` 가 읽게 하면 값이 인자에 남지 않는다.
          {
            printf 'export BUILDER_TAG=%q\n' "${BUILDER_TAG}"
            printf 'export KPUBDATA_BUILDER_API_KEY=%q\n' "${KPUBDATA_BUILDER_API_KEY}"
            printf 'export KPUBDATA_BUILDER_ALLOWED_ORIGINS=%q\n' "${KPUBDATA_BUILDER_ALLOWED_ORIGINS}"
            printf 'export KPUBDATA_BUILDER_CREDENTIAL_MASTER_KEY=%q\n' "${KPUBDATA_BUILDER_CREDENTIAL_MASTER_KEY}"
            printf 'export APP_DOMAIN=%q\n' "${APP_DOMAIN}"
            printf 'export GHCR_USER=%q\n' "${GHCR_USER}"
            printf 'export GHCR_TOKEN=%q\n' "${GHCR_TOKEN}"
            printf 'export GH_TOKEN=%q\n' "${GHCR_TOKEN}"
            printf 'export GH_REPO=%q\n' "${GH_REPO}"
            printf 'export REPO_OWNER=%q\n' "${REPO_OWNER}"
            cat ops/deploy/app-01-rollout.sh
          } | ssh -i ~/.ssh/id_oci \
                -o StrictHostKeyChecking=yes \
                -o PasswordAuthentication=no \
                "${SSH_USER}@${APP_HOST}" 'bash -s'
          echo "[deploy-app] === END $(date -u +%FT%TZ) ==="
