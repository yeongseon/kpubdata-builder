                  summary: PASS와 WARN 및 schema drift를 포함한 run quality
                  value:
                    run_id: air-quality-20260815
                    availability: available
                    evaluated_checks: 2
                    quality_results:
                      air:
                        - source_key: air
                          category: row_count
                          rule: min_rows
                          column: null
                          status: pass
                          actual: 25
                          threshold: 10
                          affected_rows: null
                          evaluated_rows: null
                          detail: null
                        - source_key: air
                          category: missing
                          rule: max_null_ratio
                          column: pm10_value
                          status: warn
                          actual: 0.04
                          threshold: 0.01
                          affected_rows: 1
                          evaluated_rows: 25
                          detail: null
                    schema_drift:
                      air:
                        - kind: column_added
                          column: station_code
                          detail: column added since previous successful run
                LegacyQualityUnavailable:
                  summary: quality 결과가 없던 legacy run
                  value:
                    run_id: air-quality-legacy
                    availability: unavailable
                    evaluated_checks: 0
                    quality_results: {}
                    schema_drift: {}
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
