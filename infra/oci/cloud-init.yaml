#cloud-config
# KPubData Builder — OCI Compute VM cloud-init (Oracle Linux / Ubuntu).
# Docker + compose 설치, 블록 볼륨 마운트, compose 기동까지 부트스트랩한다.
# 이미지 pull(GHCR private 시)·시크릿(.env)은 별도 주입 후 `docker compose up -d` 한다.
#
# 전제: 별도 Block Volume 을 인스턴스에 attach 하고 /dev/oracleoci/oraclevdb 로 노출(iSCSI/PV).
# 실제 디바이스 경로는 OCI 콘솔의 attach 방식에 따라 다르니 확인 후 아래 device 를 맞출 것.

package_update: true

packages:
  - docker.io

write_files:
  - path: /opt/kpubdata-builder/README-first.txt
    content: |
      1) 블록 볼륨을 /mnt/blockvol 에 마운트했는지 확인(runcmd 가 시도).
      2) /opt/kpubdata-builder 에 docker-compose.yml 과 .env 를 배치.
      3) (private 이미지면) docker login 후, docker compose up -d.
      4) curl -fsS http://127.0.0.1:8000/healthz 로 확인.

runcmd:
  # Docker 활성화
  - systemctl enable --now docker
  # docker compose plugin (배포판에 따라 별도 설치 필요할 수 있음)
  - [sh, -c, "docker compose version || apt-get install -y docker-compose-plugin || true"]
  # 블록 볼륨 마운트(최초 1회 포맷). DEVICE 는 실제 attach 경로로 교체할 것.
  - [sh, -c, "DEV=/dev/oracleoci/oraclevdb; if [ -b \"$DEV\" ] && ! blkid \"$DEV\"; then mkfs.ext4 -F \"$DEV\"; fi"]
  - [sh, -c, "mkdir -p /mnt/blockvol"]
  - [sh, -c, "DEV=/dev/oracleoci/oraclevdb; if [ -b \"$DEV\" ]; then grep -q /mnt/blockvol /etc/fstab || echo \"$DEV /mnt/blockvol ext4 defaults,_netdev,nofail 0 2\" >> /etc/fstab; mount -a; fi"]
  - [sh, -c, "mkdir -p /mnt/blockvol/data /mnt/blockvol/cubrid"]
  - [sh, -c, "mkdir -p /opt/kpubdata-builder"]
