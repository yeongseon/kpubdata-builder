  /query:
    post:
      operationId: queryBuiltDataset
      summary: 서버가 resolve한 Silver/Gold table에 read-only SQL 실행
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              AveragePm10ByStation:
                summary: 서버가 resolve한 Silver table 집계
                value:
                  dataset_id: seoul-air-quality
                  run_id: air-quality-20260815
                  stage: silver
                  source: air
                  sql: SELECT station_name, AVG(pm10_value) AS avg_pm10 FROM dataset GROUP BY station_name ORDER BY avg_pm10 DESC
                  limit: 100
      responses:
        "200":
          description: bounded query result preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              examples:
                AveragePm10Result:
                  summary: bounded row 결과와 현재 1.9.0 실행 시간 필드
                  value:
                    columns: [station_name, avg_pm10]
                    rows:
                      - station_name: 종로구
                        avg_pm10: 31.5
                      - station_name: 중구
                        avg_pm10: 28.0
                    truncated: false
                    execution_ms: 7
                    startup_ms: 12
                    engine_execution_ms: 5
        "400":
          description: invalid context, unsafe SQL, syntax/execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                UnsafeQuery:
                  summary: write statement가 포함된 SQL 거부
                  value:
                    error: only read-only SELECT queries are allowed
                    code: unsafe_query
                InvalidContext:
                  summary: dataset_id와 run snapshot이 일치하지 않음
                  value:
                    error: dataset does not match run snapshot
                    code: invalid_context
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: query context 소유권 위반
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                Forbidden:
                  summary: 다른 principal 소유 run
                  value:
                    error: forbidden
                    code: forbidden
        "404":
          description: stage artifact unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                ArtifactUnavailable:
                  summary: 요청 stage의 table artifact가 없음
                  value:
                    error: query artifact unavailable
                    code: artifact_unavailable
        "429":
          description: query 전용 capacity 포화. child process는 생성되지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                QueryBusy:
                  summary: query 전용 동시 실행 capacity 포화
                  value:
                    error: query is busy
                    code: query_busy
        "504":
          description: query process timeout 및 강제 종료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                QueryTimeout:
                  summary: 격리된 query process 제한 시간 초과
                  value:
                    error: query timed out
                    code: query_timeout

  /monitoring/summary:
    get:
      operationId: getMonitoringSummary
      summary: Builder API/Queue/Worker/Artifact Store 시스템 상태 요약 (#516)
      description: >-
        시스템 aggregate만 반환하며 개별 run의 dataset/owner/credential 정보는
        포함하지 않는다. Async build queue/worker(#511/#513)는 이 서비스가 항상
        생성하는 AsyncBuildExecutor의 read-only snapshot을 반영하므로 항상
        `availability: available`이다(#516). Provider 상태는 네트워크 프로브를
        유발하므로 이번 버전에서는 포함하지 않는다.
      responses:
        "200":
          description: 시스템 상태 요약
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSummaryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /monitoring/builds:
    get:
      operationId: getMonitoringBuilds
      summary: 시간대별 build 통계와 recent runs (#516)
      description: >-
        BuildIndex(ADR 0003) 기반 파생 집계. timezone은 UTC이며 bucket 경계는
        `[start, end)` 반열린이다. bucket 기준 timestamp는 `finished_at`이다.
        ENFORCE_OWNERSHIP+oidc principal일 때는 본인이 접근 가능한 run만
        집계·노출한다(#505).
      parameters:
        - name: window
          in: query
          required: false
          description: "집계 기간. 현재 24h만 지원 (기본값: 24h)"
          schema:
            type: string
            enum: [24h]
            default: 24h
        - name: bucket
          in: query
          required: false
          description: "집계 단위. 현재 hour만 지원 (기본값: hour)"
          schema:
            type: string
            enum: [hour]
            default: hour
      responses:
        "200":
          description: build 통계와 recent runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringBuildsResponse"
        "400":
          description: 지원하지 않는 window/bucket 값
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        서버에 KPUBDATA_BUILDER_API_KEY가 설정된 경우 필수. 미설정 시(로컬 개발 기본값)
        인증 없이 모든 요청이 허용된다 (#248).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Google OIDC ID 토큰 (ADR 0009). Authorization: Bearer <jwt>.
        OIDC_ISSUER 미설정 시 비활성 — 기존 ApiKeyAuth 배포에 영향 없음 (#385).

  responses:
    Unauthorized:
      description: X-API-Key가 누락되었거나 서버에 설정된 키와 일치하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            MissingOrInvalidApiKey:
              summary: 인증 정보가 없거나 일치하지 않음
              value:
                error: unauthorized

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: build 실행 식별자(경로 안전한 단일 세그먼트)
      schema:
        type: string

    DatasetId:
      name: dataset_id
      in: path
      required: true
      description: >-
        BuildSpec.dataset_id 값. slash/space 등 경로에 그대로 쓸 수 없는 문자를
        포함할 수 있으므로 클라이언트는 percent-encoding해야 한다(#488).
      schema:
        type: string

    Stage:
      name: stage
      in: path
      required: true
      description: 조회할 medallion stage
      schema:
        type: string
        enum: [bronze, silver, gold]

    ProviderName:
      name: provider
      in: path
      required: true
      description: kpubdata runtime catalog에 등록된 Provider 식별자
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 사람이 읽는 오류 요약 메시지
        code:
          type: string
          description: 클라이언트 분기용 안정적인 오류 코드(새 endpoint에서 사용)

    QueryRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, run_id, stage, sql]
      properties:
        dataset_id: {type: string}
        run_id: {type: string}
        stage: {type: string, enum: [silver, gold]}
        source: {type: string}
        sql: {type: string, maxLength: 65536}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}

    QueryResponse:
      type: object
      additionalProperties: false
      required: [columns, rows, truncated, execution_ms, startup_ms, engine_execution_ms]
      properties:
        columns:
          type: array
          items: {type: string}
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        truncated: {type: boolean}
        execution_ms:
          type: integer
          minimum: 0
          description: >-
            QueryEngine.execute 진입부터 child payload 수신·검증과 child join까지의
            parent end-to-end monotonic wall time(ms). 기존 필드 의미를 유지한다.
        startup_ms:
          type: integer
          minimum: 0
          description: >-
            Parent의 QueryEngine.execute 진입부터 spawned child가 Polars import와 bounded
            SQL setup을 끝내고 scan_parquet를 시작하기 직전까지의 monotonic time(ms).
        engine_execution_ms:
          type: integer
          minimum: 0
          description: >-
            Child에서 scan_parquet 직전부터 SQLContext 생성, execute, collect 완료
            직후까지의 Polars engine monotonic time(ms).

    ValidationError:
      type: object
      description: >-
        validate/build/preview의 spec 검증 실패 응답. SpecLoadError는
        {status:"error", error}, ValidationError는 {status:"invalid", problems}로
        나뉜다.
      required: [status]
      properties:
        status:
          type: string
          enum: [error, invalid]
        error:
          type: string
          description: status=error일 때의 파싱 오류 메시지
        problems:
          type: array
          description: status=invalid일 때의 검증 문제 목록
          items:
            type: string

    JsonValue:
      description: 표준 JSON으로 직렬화 가능한 값(null, scalar, array, object)
      type: [string, number, boolean, object, array, "null"]
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      items:
        $ref: "#/components/schemas/JsonValue"

    BuildSpec:
      type: object
      description: >-
        선언적 빌드 명세(snake_case). dataset_id/title/description/sources/exports는
        필수이고 나머지 필드는 선택이다. 세부 스키마는 spec 모델
        (spec/models.py)을 따른다. 제거된 transforms/normalization_mode 필드는
        허용하지 않는다.
      additionalProperties: true
      allOf:
        - not:
            required: [transforms]
        - not:
            required: [normalization_mode]
      required: [dataset_id, title, description, sources, exports]
      properties:
        dataset_id:
          type: string
        title:
          type: string
        description:
          type: string
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        exports:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExportTarget"
        metadata:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        publish:
          type: boolean
          default: false
        splits:
          oneOf:
            - $ref: "#/components/schemas/SplitSpec"
            - type: "null"
        pii:
          oneOf:
            - $ref: "#/components/schemas/PiiPolicy"
            - type: "null"
        license:
          type: [string, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/QualityPolicy"
            - type: "null"

    SourceRef:
      type: object
      description: >-
        kpubdata provider/dataset 참조. 제거된 normalization_mode 필드는 허용하지
        않으며 정규화와 검증은 schema 계약으로 선언한다.
      additionalProperties: true
      not:
        required: [normalization_mode]
      required: [provider, dataset]
      properties:
        provider:
          type: string
        dataset:
          type: string
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        alias:
          type: string
          default: ""
        schema:
          oneOf:
            - $ref: "#/components/schemas/SchemaContract"
            - type: "null"

    SchemaContract:
      type: object
      description: Silver 정규화 및 required-column/dtype 검증 계약
      properties:
        required:
          type: array
          items:
            type: string
          default: []
        dtypes:
          type: object
          additionalProperties:
            type: string
          default: {}
        casts:
          type: object
          additionalProperties:
            type: string
          default: {}

    ExportTarget:
      type: object
      required: [kind, output_path]
      properties:
        kind:
          type: string
        output_path:
          type: string
        options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"

    SplitSpec:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ratio, key]
        ratios:
          type: object
          additionalProperties:
            type: number
          default: {}
        key:
          type: string
          default: ""
        seed:
          type: integer
          default: 0

    PiiPolicy:
      type: object
      properties:
        mode:
          type: string
          enum: [block, warn, allow]
          default: block
        allow_columns:
          type: array
          items:
            type: string
          default: []

    QualitySeverity:
      type: string
      description: >-
        quality rule 위반 시 심각도 (#486). "warn"(기본, Build 계속 진행) |
        "fail"(Gold 진입 전 소스 실패).
      enum: [warn, fail]
      default: warn

    QualityRangeRule:
      type: object
      description: >-
        숫자 컬럼의 최소/최대 범위 규칙 (#486). min/max는 포함(inclusive) 경계이며
        자유형 eval을 쓰지 않는 typed rule이다. null 값은 위반으로 계산하지 않는다.
      required: [column]
      properties:
        column:
          type: string
        min:
          type: [number, "null"]
        max:
          type: [number, "null"]
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityCompareColumnsRule:
      type: object
      description: >-
        두 컬럼 간 비교 규칙 (#486). operator는 제한된 어휘만 허용하며 자유형
        expression/eval을 쓰지 않는다. 두 컬럼 모두 null이 아닌 행만 평가한다.
      required: [left, operator, right]
      properties:
        left:
          type: string
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        right:
          type: string
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityPolicy:
      type: object
      description: >-
        데이터 품질 임계 정책. max_duplicate_rate/max_null_ratio/min_rows(#446)는
        기존 syntax와 100% 하위 호환이며 기본 severity는 "warn"이다. 대응하는
        ``*_severity`` 필드(#486)로 명시적 FAIL을 선언할 수 있다.
      properties:
        max_duplicate_rate:
          type: [number, "null"]
        max_duplicate_rate_severity:
          $ref: "#/components/schemas/QualitySeverity"
        max_null_ratio:
          type: object
          additionalProperties:
            type: number
          default: {}
        max_null_ratio_severity:
          type: object
          description: 컬럼별 max_null_ratio severity override. 선언 안 된 컬럼은 "warn".
          additionalProperties:
            $ref: "#/components/schemas/QualitySeverity"
          default: {}
        min_rows:
          type: [integer, "null"]
        min_rows_severity:
          $ref: "#/components/schemas/QualitySeverity"
        range:
          type: array
          items:
            $ref: "#/components/schemas/QualityRangeRule"
          default: []
        compare_columns:
          type: array
          items:
            $ref: "#/components/schemas/QualityCompareColumnsRule"
          default: []

    SpecRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열

    PreviewRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 5
          description: >-
            상한 1000은 #497에서 새로 도입됐다(behavioral tightening — v1.8.0
            이전에는 상한이 없었다). 1000을 넘는 값은 400을 반환한다.
        sample_mode:
          type: string
          enum: [first, random]
          default: first
          description: >-
            "first"는 상위 N행, "random"은 seed 기반 결정적 무작위 N행이다(#497).
            Source sample과 Silver sample은 항상 같은 행 인덱스를 공유한다 —
            생략하면 기존 client와 동일하게 상위 N행을 반환한다.
        seed:
          type: integer
          description: >-
            sample_mode=random일 때 쓰는 결정적 시드(#497). 생략하면 고정
            기본값을 써서 seed 없이도 재현 가능하다. sample_mode=first에서는
            무시된다.

    BuildRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        run_id:
          type: string
          description: 명시 시 비어있지 않은 경로 안전한 단일 세그먼트여야 한다

    VersionResponse:
      type: object
      required: [service, api_version]
      properties:
        service:
          type: string
        api_version:
          type: string

    HealthResponse:
      type: object
      required: [status]
      description: liveness probe 응답 (버전·메타 정보 없이 status만, #372)
      properties:
        status:
          type: string
          const: "ok"

    CatalogResponse:
      type: object
      required: [providers]
      description: provider/dataset 카탈로그 (#416, BL2)
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProvider"

    CatalogProvider:
      type: object
      required: [name, datasets]
      properties:
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDataset"

    CatalogDataset:
      type: object
      required: [name, title, requires_service_key]
      properties:
        name:
          type: string
        title:
          type: string
        requires_service_key:
          type: boolean

    ProviderListResponse:
      type: object
      required: [providers]
      additionalProperties: false
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"

    ProviderSummary:
      type: object
      required: [provider, requires_credential, configured]
      additionalProperties: false
      properties:
        provider:
          type: string
        requires_credential:
          type: boolean
        configured:
          type: boolean
          description: user credential, server default, 또는 무인증 Provider이면 true

    ProviderCredentialPutRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential:
          type: string
          minLength: 1
          writeOnly: true
          description: 저장할 raw credential. 응답, 로그, manifest, event에 포함하지 않는다.

    ProviderCredentialMetadata:
      type: object
      required: [provider, configured, masked, updated_at]
      additionalProperties: false
      description: owner_id와 credential 원문을 포함하지 않는 사용자별 저장 메타데이터
      properties:
        provider:
          type: string
        configured:
          type: boolean
        masked:
          type: [string, "null"]
          description: 설정 시 고정 마스크. credential 일부도 노출하지 않는다.
        updated_at:
          type: [string, "null"]
          format: date-time

    ProviderCredentialGetResponse:
      type: object
      required: [configured, masked, updated_at]
      additionalProperties: false
      description: GET credential 응답. provider, owner_id, credential 원문을 포함하지 않는다.
      properties:
        configured:
          type: boolean
        masked:
          type: [string, "null"]
          description: 설정 시 고정 마스크. credential 일부도 노출하지 않는다.
        updated_at:
          type: [string, "null"]
          format: date-time

    ProviderTestResponse:
      type: object
      required: [provider, status, configured, latency_ms, checked_at]
      additionalProperties: false
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [connected, failed, not_configured]
        configured:
          type: boolean
        latency_ms:
          type: integer
          minimum: 0
        checked_at:
          type: string
          format: date-time
        error_category:
          type: string
          enum: [auth, network, timeout, provider, unknown]
        response_code:
          type: integer
          minimum: 100
          maximum: 599
          description: kpubdata가 구조적으로 신뢰 가능한 status를 제공한 경우에만 포함

    StructuredProblem:
      type: object
      required: [code, path, message]
      description: 구조화된 검증 문제 (#417, BL3)
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string
        hint:
          type: string
          nullable: true

    ValidateResponse:
      type: object
      required: [status, dataset_id, api_version]
      properties:
        status:
          type: string
          enum: [valid]
        dataset_id:
          type: string
        api_version:
          type: string

    PreviewResponse:
      type: object
      required: [dataset_id, previews]
      properties:
        dataset_id:
          type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/SourcePreview"

    SourcePreview:
      type: object
      required:
        - source_key
        - status
        - error
        - schema
        - sample
        - total_rows
        - statistics
        - quality_results
        - source_sample
        - sample_mode
        - diff_available
        - diffs
        - transform_summary
        - diff_truncated
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        error:
          type: [string, "null"]
        schema:
          type: array
          items:
            type: object
            required: [name, dtype, nullable, unique_count]
            properties:
              name:
                type: string
              dtype:
                type: string
              nullable:
                type: boolean
              unique_count:
                type: integer
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        total_rows:
          type: integer
        statistics:
          $ref: "#/components/schemas/TableStatistics"
        quality_results:
          type: array
          description: >-
            구조화된 Quality/Schema 평가 결과 (#486). Build와 동일한 evaluator
            결과이며 PASS를 포함한 실제로 평가된 check만 담는다. drift는 preview가
            워크스페이스에 아무것도 쓰지 않으므로 포함하지 않는다.
          items:
            $ref: "#/components/schemas/QualityCheckResult"
        source_sample:
          type: array
          description: >-
            변환 전 Bronze 원본 sample(#497). diff_available=false여도 최선
            노력으로 채워질 수 있다(조회 자체가 실패하면 빈 배열).
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        sample_mode:
          type: string
          enum: [first, random]
          description: 이 응답에 실제로 적용된 sampling 방식.
        diff_available:
          type: boolean
          description: >-
            source_sample[i]와 sample[i]가 동일 논리 행을 가리킨다고 보장할 수
            있을 때만 true다(#497). 행 수 불일치, row reorder/filter 가능성,
            조회 실패 등에서는 false이며 diffs/transform_summary는 빈 값이다.
            잘못된 index 기반 비교보다 false가 우선이다.
        diffs:
          type: array
          description: >-
            diff_available=true일 때만 채워지는 셀 단위 변경 목록(#497). limit은
            행 수만 제한하고 컬럼 수는 제한하지 않으므로, 실제 변경 셀 수가
            많으면 최대 1000개(MAX_PREVIEW_DIFF_ITEMS)까지만 담긴다 —
            diff_truncated로 잘렸는지 확인한다.
          items:
            $ref: "#/components/schemas/PreviewDiffItem"
        transform_summary:
          description: >-
            diff_available=true일 때만 채워지는 변경 요약(#497). 비교 가능한
            sample 범위 기준이며 전체 dataset 변화량이 아니다. diffs가
            diff_truncated로 잘려도 changed_cells/changed_rows는 잘리지 않은
            실제 합계를 유지한다.
          oneOf:
            - $ref: "#/components/schemas/PreviewTransformSummary"
            - type: "null"
        diff_truncated:
          type: boolean
          description: >-
            diffs가 MAX_PREVIEW_DIFF_ITEMS(1000) 상한에 걸려 실제 변경 셀 전부를
            담지 못했으면 true다(#497 sample/diff memory 상한). diffs를 전체
            diff로 오인하지 않도록 명시한다. diff_available=false면 애초에
            diff를 시도하지 않았으므로 항상 false다.

    PreviewDiffItem:
      type: object
      description: >-
        Source↔Silver 셀 단위 변경 하나(#497). diff_available=true인 source의
        diffs에만 등장한다.
      additionalProperties: false
      required: [row, column, before, after, transform]
      properties:
        row:
          type: integer
          minimum: 0
          description: source_sample/sample 배열 내 0-based 위치(전체 dataset의 절대 행 번호 아님).
        column:
          type: string
        before:
          $ref: "#/components/schemas/JsonValue"
        after:
          $ref: "#/components/schemas/JsonValue"
        transform:
          type: [string, "null"]
          description: >-
            컬럼에 선언된 캐스팅(schema.casts)이 있을 때만 "cast:{dtype}" 형태로
            채운다. 알 수 없는 변환은 추측하지 않고 null.

    PreviewTransformSummary:
      type: object
      description: 비교 가능한 sample 범위에서 계산한 변경 요약(#497).
      additionalProperties: false
      required: [changed_cells, changed_rows]
      properties:
        changed_cells:
          type: integer
          minimum: 0
        changed_rows:
          type: integer
          minimum: 0

    QualityCheckResult:
      type: object
      description: 단일 quality/schema check의 구조화된 결과 (#486).
      additionalProperties: false
      required:
        - source_key
        - category
        - rule
        - column
        - status
        - actual
        - threshold
        - affected_rows
        - evaluated_rows
        - detail
      properties:
        source_key:
          type: string
        category:
          type: string
          description: >-
            check 대분류(예: duplicate, missing, row_count, schema, range,
            compare_columns).
        rule:
          type: string
          description: >-
            구체적 rule 이름(예: max_duplicate_rate, max_null_ratio, min_rows,
            required_column, dtype, range, compare_columns).
        column:
          type: [string, "null"]
          description: >-
            관련 컬럼명. 테이블 전체 규칙이면 null. compare_columns는
            "{left},{right}" 형식의 합성값을 쓴다.
        status:
          type: string
          enum: [pass, warn, fail]
        actual:
          $ref: "#/components/schemas/JsonValue"
        threshold:
          $ref: "#/components/schemas/JsonValue"
          description: >-
            원래 규칙의 비교 조건. 기존 비율/행 수 규칙은 numeric 값을 유지한다.
            range는 {min, max}, compare_columns는 {operator, right_column} 구조다.
        affected_rows:
          type: [integer, "null"]
          description: 위반 행 수. 정확히 셀 수 없으면 null(임의 추정 금지).
        evaluated_rows:
          type: [integer, "null"]
          description: 실제 평가에 사용된 행 수. 의미 없으면 null.
        detail:
          type: [string, "null"]
          description: >-
            평가 불가 이유 등 사용자가 이해할 수 있는 결정적 설명. 정상 평가 결과는
            null이며 내부 예외·스택 트레이스·절대 경로를 포함하지 않는다.

    SchemaDriftFinding:
      type: object
      description: >-
        구조화된 schema drift 관찰 (#445, #486). deterministic 감지 결과이며
        PASS/WARN/FAIL 게이트에는 관여하지 않는다(참고용).
      additionalProperties: false
      required: [kind, column, detail]
      properties:
        kind:
          type: string
          enum: [column_added, column_removed, dtype_changed, row_count_jump]
        column:
          type: [string, "null"]
        detail:
          type: string

    BuildQualityResponse:
      type: object
      description: >-
        run의 구조화된 quality_results/schema_drift 조회 응답 (#486). `availability`와
        `evaluated_checks`는 빈 `quality_results`가 "0건 평가"인지 "애초에 계산된 적
        없음"(legacy/partial run)인지 구분한다(#514).
      required: [run_id, availability, evaluated_checks, quality_results, schema_drift]
      properties:
        run_id:
          type: string
        availability:
          type: string
          enum: [available, partial, unavailable]
          description: >-
            available: 이 run이 시도한 모든 source의 quality 결과가 있다(0건일 수
            있음). partial: 일부 source만 있다(예: 한 source의 Silver 실패).
            unavailable: 결과가 전혀 없다 — quality_results 필드 자체가 없는 legacy
            run(#486 이전)뿐 아니라, 필드는 있지만(`{}`) 시도한 source 중 하나도
            결과가 없는 새 run도 포함한다(예: 모든 source가 quality 단계 진입 전에
            실패).
        evaluated_checks:
          type: integer
          minimum: 0
          description: quality_results 전체에서 실제로 평가된 check(PASS/WARN/FAIL) 총합.
        quality_results:
          type: object
          description: source_key → QualityCheckResult 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"

    DatasetQualityHistoryEntry:
      type: object
      description: >-
        단일 run의 quality PASS/WARN/FAIL 집계 (#486). evaluated_checks==0이면
        rule_pass_rate는 반드시 null이다(미평가를 100%로 위장하지 않는다).
      required:
        - run_id
        - timestamp
        - status
        - pass_count
        - warn_count
        - fail_count
        - evaluated_checks
        - rule_pass_rate
        - validated_rows
      properties:
        run_id:
          type: string
        timestamp:
          type: [string, "null"]
          description: finished_at(없으면 started_at).
        status:
          type: string
          enum: [ok, failed, cancelled]
        pass_count:
          type: integer
        warn_count:
          type: integer
        fail_count:
          type: integer
        evaluated_checks:
          type: integer
          description: pass_count + warn_count + fail_count.
        rule_pass_rate:
          type: [number, "null"]
          description: pass_count / evaluated_checks. evaluated_checks==0이면 null.
        validated_rows:
          type: [integer, "null"]
          description: >-
            run/source의 Silver row_count 합계(#488 row_counts semantics 재사용).
            evaluated_rows를 rule 수만큼 중복 합산하지 않는다.

    DatasetQualityHistoryResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          description: newest first.
          items:
            $ref: "#/components/schemas/DatasetQualityHistoryEntry"

    TableStatistics:
      type: object
      required: [row_count, null_counts, duplicate_rate]
      properties:
        row_count:
          type: integer
        null_counts:
          type: object
          additionalProperties:
            type: integer
        duplicate_rate:
          type: number

    BuildOutcome:
      type: object
      required: [source_key, status, stages_completed, error]
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        stages_completed:
          type: array
          items:
            type: string
        error:
          type: [string, "null"]

    BuildSuccessResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        manifest:
          type: string
          description: 기록된 manifest.json의 경로
        api_version:
          type: string

    BuildFailureResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version, error]
      properties:
        status:
          type: string
          enum: [failed]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        manifest:
          type: string
          description: partial 정책으로 남은 manifest.json의 경로
        api_version:
          type: string
        error:
          type: string
          description: 첫 번째 실패 outcome의 error에서 파생된 human-readable 요약 (#226)

    ArtifactsResponse:
      type: object
      required: [run_id, files]
      properties:
        run_id:
          type: string
        files:
          type: array
          items:
            type: string
            description: run 디렉터리 기준 상대 파일 경로

    BuildManifest:
      type: object
      required: [build_id, started_at, finished_at, schema_version]
      additionalProperties: true
      properties:
        build_id:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        schema_version:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        row_counts:
          type: object
          additionalProperties:
            type: integer
        inputs_fingerprint:
          type: [string, "null"]
        created_by:
          type: [string, "null"]
          description: >-
            빌드를 요청한 principal의 display/legacy 라벨(#388). 사람이 읽는
            표시용이며, ownership 판정에는 owner_id가 없는 legacy run에 한해
            하위 호환 폴백으로만 쓰인다.
        quality_results:
          type: object
          description: >-
            source_key → QualityCheckResult 목록 (#486, additive). legacy
            manifest는 이 필드가 없다 — 부재를 "미평가"로 해석해야 하며
            "전부 PASS"로 해석하면 안 된다.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록 (#486, additive).
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"

    BuildSpecSnapshotResponse:
      type: object
      required: [run_id, spec, spec_digest]
      additionalProperties: false
      properties:
        run_id:
          type: string
        spec:
          type: string
          description: credential 값이 redaction된 canonical YAML
        spec_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            실제 저장된 redaction 후 canonical buildspec.yaml bytes의 SHA-256.
            credential 값만 다른 spec은 같은 digest가 될 수 있다.

    BuildSummary:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          description: 빌드 실행 식별자
        status:
          type: string
          enum: [ok, failed]
          description: 빌드 상태
        started_at:
          type: [string, "null"]
          description: 빌드 시작 시각 (ISO 8601 또는 null)
        finished_at:
          type: [string, "null"]
          description: 빌드 완료 시각 (ISO 8601 또는 null)

    BuildsResponse:
      type: object
      required: [builds]
      properties:
        builds:
          type: array
          items:
            $ref: "#/components/schemas/BuildSummary"

    # ---------------------------------------------------------------------
    # Dataset Catalog / Stage Summary API (#488)
    # ---------------------------------------------------------------------

    DatasetSourceRef:
      type: object
      description: dataset의 canonical snapshot에 선언된 소스 참조 (secret 없음)
      required: [provider, dataset, alias]
      properties:
        provider:
          type: string
        dataset:
          type: string
        alias:
          type: string

    StageStatusValue:
      type: string
      description: >-
        completed(완전한 산출물 존재) / failed(manifest에 실패로 기록됨) /
        not_run(상위 단계가 끝나지 못해 시도되지 않음) / unavailable(디렉터리는
        있지만 불완전·손상됨, legacy 형식 등)
      enum: [completed, failed, not_run, unavailable]

    DatasetStageMap:
      type: object
      description: source_key → {bronze, silver, gold} 상태 맵
      additionalProperties:
        type: object
        required: [bronze, silver, gold]
        properties:
          bronze:
            $ref: "#/components/schemas/StageStatusValue"
          silver:
            $ref: "#/components/schemas/StageStatusValue"
          gold:
            $ref: "#/components/schemas/StageStatusValue"

    DatasetSummary:
      type: object
      description: >-
        동일 dataset_id를 공유하는 여러 run을 접근 가능한 latest run 기준으로
        묶은 built dataset 요약. quality는 #486의 구조화된 품질 게이트가
        선반영되지 않았으므로 항상 null이다(N/A) — 미평가를 PASS로 표시하지 않는다.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
          description: latest run의 finished_at(없으면 started_at)
        row_counts:
          type: object
          description: >-
            source_key별 Silver row_count. multi-source dataset을 단일 값으로
            축약하지 않는다.
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
          description: row_counts 값의 합계
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
          description: "#486 선반영 안 함 — 구조화된 quality 결과가 없으므로 항상 null"

    DatasetDetailResponse:
      type: object
      description: DatasetSummary와 동일한 필드에 run_count가 추가된 단일 dataset 상세 응답.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
        - run_count
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
        row_counts:
          type: object
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
        run_count:
          type: integer
          description: 이 principal에게 접근 가능한 이 dataset_id의 run 총 개수

    DatasetsResponse:
      type: object
      required: [datasets]
      properties:
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"

    DatasetRunSummary:
      type: object
      required: [run_id, status, started_at, finished_at, spec_digest, created_by]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        started_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]
        spec_digest:
          type: [string, "null"]
        created_by:
          type: [string, "null"]

    DatasetRunsResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRunSummary"

    StageState:
      type: object
      required: [status, available]
      properties:
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
          description: "status == completed 의 편의 boolean"

    RunStageEntry:
      type: object
      required: [source_key, bronze, silver, gold]
      properties:
        source_key:
          type: string
        bronze:
          $ref: "#/components/schemas/StageState"
        silver:
          $ref: "#/components/schemas/StageState"
        gold:
          $ref: "#/components/schemas/StageState"

    RunStagesResponse:
      type: object
      required: [run_id, sources]
      properties:
        run_id:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RunStageEntry"

    StageDetailResponse:
      description: >-
        실제 stage 값에 따라 Bronze/Silver/Gold 상세 응답 중 하나를 반환한다.
        모든 분기는 runtime wire response의 필드를 명시하며 raw fetch_params,
        export options, credential, 절대 filesystem 경로를 노출하지 않는다.
      required: [run_id, stage, source_key, status, available]
      oneOf:
        - $ref: "#/components/schemas/BronzeStageDetailResponse"
        - $ref: "#/components/schemas/SilverStageDetailResponse"
        - $ref: "#/components/schemas/GoldStageDetailResponse"

    BronzeStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - provider
        - dataset
        - fetched_at
        - record_count
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [bronze]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        provider:
          type: [string, "null"]
        dataset:
          type: [string, "null"]
        fetched_at:
          type: [string, "null"]
        record_count:
          type: [integer, "null"]

    SilverColumnInfo:
      type: object
      additionalProperties: false
      required: [name, dtype, nullable, unique_count]
      properties:
        name:
          type: string
        dtype:
          type: string
        nullable:
          type: boolean
        unique_count:
          type: integer

    SilverValidationProblem:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
        field:
          type: [string, "null"]
        message:
          type: string

    SilverValidationResult:
      type: object
      additionalProperties: false
      required: [ok, problems]
      properties:
        ok:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/SilverValidationProblem"

    SilverStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - schema
        - statistics
        - validation
        - sample
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [silver]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        schema:
          type: array
          items:
            $ref: "#/components/schemas/SilverColumnInfo"
        statistics:
          oneOf:
            - $ref: "#/components/schemas/TableStatistics"
            - type: "null"
        validation:
          oneOf:
            - $ref: "#/components/schemas/SilverValidationResult"
            - type: "null"
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"

    GoldExportSummary:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string

    GoldStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - columns
        - splits
        - exports
        - sample
        - sample_available
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [gold]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        columns:
          type: array
          items:
            type: string
        splits:
          oneOf:
            - type: object
              additionalProperties:
                type: integer
            - type: "null"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/GoldExportSummary"
        sample:
          type: "null"
        sample_available:
          type: boolean
          enum: [false]

    # ---------------------------------------------------------------------
    # Monitoring API (#516)
    # ---------------------------------------------------------------------

    MonitoringApiStatus:
      type: object
      description: >-
        Builder API 요청 처리 latency 상태. availability=available은 latency
        collector(ring buffer)가 정상적으로 표본을 읽어낼 수 있었다는 뜻이며,
        collector 자체가 손상되어 표본을 읽을 수 없으면(#527) unavailable +
        sample_count=null + p95_latency_ms=null이다 — "정상 무표본"
        (available + sample_count=0 + p95_latency_ms=null)과 "측정 불가"를
        같은 값으로 뭉개지 않는다. 이 subsystem 실패는 원 요청이나 이
        monitoring 응답 자체를 실패시키지 않는다. Healthy/Degraded 같은
        latency 임계값 판정은 근거(ADR/config)가 없어 이번 버전에서 발명하지
        않는다 — raw sample_count/p95_latency_ms만 제공한다.
      required: [availability, sample_count, p95_latency_ms]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        sample_count:
          type: [integer, "null"]
          minimum: 0
          description: >-
            최근 최대 1000개 요청 ring buffer에 현재 보관된 표본 수.
            availability가 unavailable이면(collector 실패) null.
        p95_latency_ms:
          type: [number, "null"]
          description: >-
            sample_count가 0이거나 availability가 unavailable이면 null.
            nearest-rank 방식(보간 없음)으로 계산.

    MonitoringQueueStatus:
      type: object
      description: >-
        Async build queue 상태(#516). AsyncBuildExecutor/AsyncBuildJobRegistry
        (#511/#513)의 read-only snapshot을 반영하며, 이 서비스는 항상
        AsyncBuildExecutor를 생성하므로 정상 runtime에서는 항상
        availability: available이다. waiting/running=0은 "대기/실행 중인 job이
        실제로 없다"는 뜻이며, availability가 unavailable일 때만(예: async
        build를 지원하지 않는 구성) 나머지 필드가 null이다 — "0건"과 "확인
        불가"를 구분한다. total = waiting + running이며 terminal
        (succeeded/failed/cancelled) job 이력은 포함하지 않는다.
      required: [availability, waiting, running, total]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        waiting:
          type: [integer, "null"]
          description: status=queued인 active job 수. unavailable이면 null.
        running:
          type: [integer, "null"]
          description: status=running인 active job 수. unavailable이면 null.
        total:
          type: [integer, "null"]
          description: waiting + running. unavailable이면 null.

    MonitoringWorkerStatus:
      type: object
      description: >-
        Async build worker pool 상태(#516). 근거는 MonitoringQueueStatus와
        동일 — AsyncBuildExecutor가 항상 생성되므로 정상 runtime에서는 항상
        availability: available이다. utilization은 0.0~1.0 ratio다(퍼센트
        아님). unavailable일 때만 나머지 필드가 null이다.
      required: [availability, active, capacity, utilization]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        active:
          type: [integer, "null"]
          description: 현재 running job 수. unavailable이면 null.
        capacity:
          type: [integer, "null"]
          description: >-
            AsyncBuildExecutor 생성 시 지정한 max_workers. unavailable이면
            null.
        utilization:
          type: [number, "null"]
          description: >-
            active / capacity ratio, 0.0~1.0. capacity가 0보다 클 때만 계산되며
            unavailable이면 null(0.0으로 위장하지 않는다).

    MonitoringArtifactStatus:
      type: object
      description: >-
        Artifact Store 상태. output_root 폴더가 존재한다는 사실만으로
        available로 간주하지 않는다 — BuildIndex 쿼리도 성공해야 available이다.
        절대 파일시스템 경로는 노출하지 않는다.
      required: [availability, last_write_at]
      additionalProperties: false
      properties:
        availability:
          type: string
          enum: [available, partial, unavailable]
        last_write_at:
          type: [string, "null"]
          format: date-time
          description: >-
            BuildIndex에 기록된 가장 최근 성공(ok) 빌드의 완료 시각. 성공 기록이
            없으면 available이되 null(0건과 확인 불가를 구분).

    MonitoringSummaryResponse:
      type: object
      description: >-
        Studio Monitoring 화면용 시스템 상태 요약 (#516). Provider 상태는
        요청마다 네트워크 프로브를 유발하므로(#492) 이번 버전에서는 포함하지
        않는다.
      required: [generated_at, status, api, queue, workers, artifact_store]
      additionalProperties: false
      properties:
        generated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [healthy, degraded]
          description: >-
            required subsystem(api/queue/workers/artifact_store) availability로부터
            계산되는 deterministic aggregate status. 넷 모두 available이면
            healthy, 하나라도 partial/unavailable이면 degraded. latency
            threshold(SLA)는 사용하지 않으며 sample_count=0/p95_latency_ms=null
            자체는 degraded 근거가 아니다. Provider status(#492, optional)는
            이 판정에 포함되지 않는다.
        api:
          $ref: "#/components/schemas/MonitoringApiStatus"
        queue:
          $ref: "#/components/schemas/MonitoringQueueStatus"
        workers:
          $ref: "#/components/schemas/MonitoringWorkerStatus"
        artifact_store:
          $ref: "#/components/schemas/MonitoringArtifactStatus"

    MonitoringBuildBucket:
      type: object
      description: >-
        [bucket_start, bucket_end) 반열린 구간의 build 카운트 (UTC). success는
        내부 BuildIndex status "ok"를 외부 wire 명명으로 매핑한 값이다(#527) —
        내부 BuildIndex status vocabulary(ok/failed/cancelled) 자체는 바뀌지
        않는다.
      required: [bucket_start, bucket_end, total, success, failed, cancelled]
      additionalProperties: false
      properties:
        bucket_start:
          type: string
          format: date-time
        bucket_end:
          type: string
          format: date-time
        total:
          type: integer
          minimum: 0
        success:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0

    MonitoringRecentRun:
      type: object
      description: Monitoring 화면용 최소 run 요약. dataset_id/owner_id/error 등은 노출하지 않는다.
      required: [run_id, status, started_at, finished_at]
      additionalProperties: false
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        started_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]

    MonitoringBuildsResponse:
      type: object
      description: >-
        window/bucket별 build 통계(#516). timezone은 UTC. bucket 기준
        timestamp는 finished_at. excluded_count는 malformed timestamp로 집계에서
        제외된 행 수이며, 0보다 크면 availability는 partial이다.
      required: [window, bucket, availability, excluded_count, buckets, recent_runs]
      additionalProperties: false
      properties:
        window:
          type: string
          enum: [24h]
        bucket:
          type: string
          enum: [hour]
        availability:
          type: string
          enum: [available, partial, unavailable]
          description: >-
            available: 집계 성공(0건이어도 유효). partial: BuildIndex 쿼리는
            성공했지만 malformed timestamp로 일부 행이 제외됨. unavailable:
            BuildIndex 쿼리 자체가 실패함(buckets는 빈 배열).
        excluded_count:
          type: integer
          minimum: 0
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringBuildBucket"
        recent_runs:
          type: array
          items:
            $ref: "#/components/schemas/MonitoringRecentRun"
