[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpubdata-builder"
version = "0.1.0"
description = "Dataset artifact pipeline for KPubData — turns normalized records into publishable outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yeongseon Choe" }
]
keywords = [
  "korea", "public-data", "dataset", "pipeline", "builder", "export",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # Builder depends on the kpubdata Client API (Client.dataset(...).list, etc.).
  # kpubdata 0.6.0 removed 141 retired datasets (breaking) — builder references
  # none of them (verified 2026-09-09). Pin to the 0.6 line; compat policy: #213.
  "kpubdata>=0.6.0,<0.7",
  "cryptography>=50,<51",
  "polars>=1.0,<2",
  "pyyaml>=6.0,<7",
  "sqlglot>=30.17,<31",
  "typing_extensions>=4.5,<5",
  "urllib3>=2.7.0,<3",
]

[project.scripts]
kpubdata-builder = "kpubdata_builder.cli:main"

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9,<10",
  "mkdocs>=1.6,<2",
]
parquet = ["pyarrow>=15,<26"]
huggingface = ["huggingface-hub>=0.23,<2"]
# PyJWT 2.9+ 부터 issuer=list 지원 (#434). auth.py:_verify_bearer_token 이
# list(=여러 issuer)를 jwt.decode(issuer=...)로 넘기므로, 하한을 되돌리면
# 2.8.x 환경에서 모든 토큰이 InvalidIssuerError 로 거부된다.
auth = ["pyjwt[crypto]>=2.9,<3"]
# CUBRID 상태 백엔드(선택, ADR 0016). sqlalchemy-cubrid 는 순수 파이썬 드라이버
# pycubrid 와 SQLAlchemy 2.x(>=2.0,<2.3)를 유입한다. 기본 백엔드(sqlite/local FS)는
# 이 extra 없이 동작하므로 코어 dependencies 에는 넣지 않는다 — 무외부의존 기본값 유지.
# 드라이버가 Python 3.12+ 를 요구하므로, 3.10/3.11 에서 `[cubrid]` 를 명시 설치하면
# 설치 단계에서 명확히 실패한다(런타임 ImportError 보다 낫다). 배포 이미지는 3.12-slim.
cubrid = ["sqlalchemy-cubrid[pycubrid]>=1.7,<1.8"]
publish = ["huggingface-hub>=0.23,<2", "xmltodict>=0.13,<2", "kaggle>=1.6,<2"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0",
  # Windows에서 zoneinfo가 시스템 tz 데이터베이스를 찾지 못하는 경우를
  # 대비해 tzdata wheel을 보장한다(#553). Linux에서는 no-op다.
  "tzdata>=2024.1",
  # auth extra를 dev에 포함해 CI(mypy/ruff/pytest)에서 항상 타입 체크 가능 (#385).
  "pyjwt[crypto]>=2.9,<3",
  # CUBRID 백엔드 타입체크/스모크용. 드라이버가 Python 3.12+ 를 요구하므로 환경
  # 마커로 게이팅한다 — 3.10/3.11 dev 환경(.venv 등)을 깨지 않는다.
  "sqlalchemy-cubrid[pycubrid]>=1.7,<1.8; python_version >= '3.12'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kpubdata_builder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

# CUBRID 백엔드 의존성은 optional(Python 3.12+ 전용, ADR 0016)이라 기본 dev 환경
# (3.10/3.11)에는 설치되지 않는다. 미설치 시 "cannot find module" 로 실패하지 않도록
# missing import 를 무시한다 — 설치된 3.12 환경에서는 각 패키지의 실제 타입(py.typed)을
# 그대로 사용하므로 타입 검사 정확도는 유지된다.
[[tool.mypy.overrides]]
module = ["sqlalchemy.*", "sqlalchemy_cubrid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# cubrid marker 테스트는 기본 제외(sqlalchemy·CUBRID 필요, Python 3.12+ optional extra).
# 실행: `pytest -m cubrid` (명령행 -m 이 이 기본값을 override 한다).
addopts = "-ra -m 'not cubrid'"
testpaths = ["tests"]
markers = [
  "cubrid: CUBRID 백엔드 계약/통합 테스트 (기본 제외; sqlalchemy 필요, ADR 0016).",
]

[tool.uv.sources]
kpubdata = { path = "../kpubdata", editable = true }
