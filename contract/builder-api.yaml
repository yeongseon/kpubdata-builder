openapi: 3.1.0
info:
  title: KPubData Builder Service API
  version: "1.8.0"
  description: >-
    Builder 중심 서비스 계약. BuildSpec 검증, preview, build 실행, artifact 조회,
    계약 버전 조회를 제공한다. CLI와 HTTP service mode(#36)가 동일한 도메인 계약을
    공유한다. 본 문서는 BuilderService(service/app.py)의 dispatch 라우팅과 실제
    wire 형태를 기계 판독용(OpenAPI 3.1) 단일 소스로 고정하며, Studio 같은 소비자가
    타입 클라이언트를 생성하는 기준이 된다. v0.4에서는 동기식 build만 유지하며
    비동기/publish 엔드포인트는 제외된다(ADR 0002, #226). v1.5.0은 built dataset
    단위 조회(dataset_id로 여러 run을 grouping)와 Bronze/Silver/Gold stage
    summary/preview API를 추가했다(#488, additive). v1.6.0은 구조화된 Quality/Schema
    Drift 결과(PASS 포함 모든 evaluated check)와 dataset별 quality history/trend
    API를 추가한다(#486, additive — 기존 엔드포인트는 변경되지 않는다). `GET
    /builds/{run_id}/quality`는 `availability`(`available`/`partial`/`unavailable`)와
    `evaluated_checks`를 함께 반환해 "0건 평가"와 "애초에 계산된 적 없음"을
    구분한다(#514, additive). v1.7.0은 Silver/Gold read-only `/query`를
    추가한다(#504, additive). v1.8.0은 stable principal별 encrypted Provider
    credential CRUD와 Provider status/test API를 추가한다(#492, additive).
servers:
  - url: http://localhost:8000
    description: 로컬 builder 개발 서버

security:
  - ApiKeyAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: 무인증 liveness probe (버전·메타 정보 없이 status만)
      security: []
      responses:
        "200":
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      operationId: getVersion
      summary: Builder API 계약 버전 조회
      responses:
        "200":
          description: 서비스/계약 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /catalog:
    get:
      operationId: getCatalog
      summary: provider/dataset 카탈로그 조회 (BL2, #416)
      responses:
        "200":
          description: 사용 가능한 provider와 dataset 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: 카탈로그 조회 실패

  /providers:
    get:
      operationId: listProviders
      summary: 런타임 Provider와 현재 principal의 configured 상태 조회
      responses:
        "200":
          description: Provider 목록. credential 원문과 owner_id는 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/status:
    get:
      operationId: getProviderStatus
      summary: 현재 principal credential로 Provider 연결 상태 확인
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 연결 상태 또는 not_configured 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/test:
    post:
      operationId: testProviderConnection
      summary: 현재 principal credential로 lightweight connection test 실행
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 구조화된 connection test 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/credential:
    get:
      operationId: getProviderCredential
      summary: 현재 principal의 저장 credential 메타데이터 조회
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 원문을 제외한 credential 메타데이터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패
        "503":
          description: encrypted credential store가 구성되지 않음
    put:
      operationId: putProviderCredential
      summary: 현재 principal의 Provider credential 생성 또는 교체
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCredentialPutRequest"
      responses:
        "200":
          description: 저장된 credential 메타데이터. 원문은 echo하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialMetadata"
        "400":
          description: credential 누락, 빈 값, 또는 허용되지 않은 필드
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패
        "503":
          description: encrypted credential store가 구성되지 않음
    delete:
      operationId: deleteProviderCredential
      summary: 현재 principal의 저장 Provider credential 삭제
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: credential 삭제 완료. 존재하지 않아도 idempotent하게 성공한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialMetadata"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패
        "503":
          description: encrypted credential store가 구성되지 않음

  /validate:
    post:
      operationId: validateSpec
      summary: BuildSpec 검증 (동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecRequest"
      responses:
        "200":
          description: 검증 통과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
        "400":
          description: spec 파싱 실패 또는 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /preview:
    post:
      operationId: previewBuild
      summary: 각 소스의 스키마와 샘플 행 산출 (파일 미기록, 동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: preview 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, limit 타입 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: principal credential로 Provider client를 생성할 수 없음

  /build:
    post:
      operationId: createBuild
      summary: 파이프라인 실행 및 결과 반환 (동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
      responses:
        "200":
          description: 모든 소스 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSuccessResponse"
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, run_id 타입/경로 안전성 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: >-
            하나 이상의 소스 fetch/stage 실패. upstream 소스 의존 실패이며 매니페스트는
            partial 정책으로 남는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildFailureResponse"

  /artifacts/{run_id}:
    get:
      operationId: listBuildArtifacts
      summary: 실행 워크스페이스의 산출물 파일 목록 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: artifact 파일 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsResponse"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/manifest:
    get:
      operationId: getBuildManifest
      summary: 실행 워크스페이스의 manifest.json 본문 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: manifest.json 본문
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildManifest"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 해당 run 또는 manifest를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: manifest 파일을 읽거나 JSON으로 해석할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/spec:
    get:
      operationId: getBuildSpecSnapshot
      summary: 실행에 사용한 canonical BuildSpec snapshot 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: redaction된 canonical buildspec.yaml 본문과 SHA-256 digest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSpecSnapshotResponse"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run이 없거나 legacy run에 snapshot이 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: snapshot 파일을 읽거나 UTF-8로 해석할 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds:
    get:
      operationId: listBuilds
      summary: "빌드 이력 목록 조회 (최신 수정 시각 기준 내림차순)"
      parameters:
        - name: limit
          in: query
          required: false
          description: "반환할 최대 빌드 수 (기본값: 50)"
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: 빌드 이력 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildsResponse"
        "400":
          description: 잘못된 limit 파라미터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /datasets:
    get:
      operationId: listDatasets
      summary: >-
        Built dataset 목록 조회 (dataset_id별 grouping, #488). 동일 dataset_id의
        여러 run을 접근 가능한 latest run 기준으로 하나의 dataset으로 묶는다.
        buildspec.yaml snapshot이 없는 legacy run은 grouping 대상에서 제외된다.
      parameters:
        - name: limit
          in: query
          required: false
          description: "반환할 최대 dataset 수 (기본값: 50)"
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: built dataset 목록 (latest run 기준 요약)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetsResponse"
        "400":
          description: 잘못된 limit 파라미터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /datasets/{dataset_id}:
    get:
      operationId: getDataset
      summary: 단일 built dataset의 canonical 요약 조회 (latest accessible run 기준, #488)
      parameters:
        - $ref: "#/components/parameters/DatasetId"
      responses:
        "200":
          description: dataset 요약 (title/sources/latest run/row_counts/stage 상태 등)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetDetailResponse"
        "400":
          description: dataset_id가 비어 있음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: >-
            접근 가능한 run이 없는 dataset_id. dataset_id가 실제로 존재하지 않는
            경우와 타 사용자 소유 run만 있는 경우를 구분해 노출하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /datasets/{dataset_id}/runs:
    get:
      operationId: listDatasetRuns
      summary: dataset_id의 접근 가능한 run history 조회 (최신순, #488)
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: limit
          in: query
          required: false
          description: "반환할 최대 run 수 (기본값: 50)"
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: dataset의 run history (newest first, 타 사용자 run 제외)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetRunsResponse"
        "400":
          description: dataset_id가 비어 있거나 limit이 잘못됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 접근 가능한 run이 없는 dataset_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/stages:
    get:
      operationId: listBuildStages
      summary: run에 알려진 모든 source의 Bronze/Silver/Gold 상태 조회 (#488)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: source별 Bronze/Silver/Gold 상태 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunStagesResponse"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/stages/{stage}:
    get:
      operationId: getBuildStageDetail
      summary: >-
        단일 source의 단일 stage(bronze/silver/gold)에 대한 안전한 summary/preview
        조회 (#488). raw fetch_params, export options, credential, 절대 경로는
        어디에도 담기지 않는다. Silver sample은 build 시점에 이미 persist된 상한
        (기본 5행) 안에서만 반환되며 parquet 전체를 읽지 않는다.
      parameters:
        - $ref: "#/components/parameters/RunId"
        - $ref: "#/components/parameters/Stage"
        - name: source
          in: query
          required: true
          description: 조회할 source_key (run에 알려진 source여야 함)
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: "Silver sample 행 수 상한 (기본값: 5, 다른 stage에서는 무시됨)"
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 5
      responses:
        "200":
          description: stage summary/preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageDetailResponse"
        "400":
          description: >-
            경로 안전하지 않은 run_id/source, 잘못된 stage 이름, source 누락,
            또는 잘못된 limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run이 없거나, source가 이 run에 알려지지 않음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /datasets/{dataset_id}/quality/history:
    get:
      operationId: getDatasetQualityHistory
      summary: >-
        dataset_id의 접근 가능한 run들에 대한 Quality PASS/WARN/FAIL 집계 이력
        (#486). dataset→run 조회는 #488과 동일한 helper를 재사용하며, ownership도
        동일 semantics를 공유한다.
      parameters:
        - $ref: "#/components/parameters/DatasetId"
        - name: limit
          in: query
          required: false
          description: "반환할 최대 run 수 (기본값: 30)"
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: run별 quality 집계 이력 (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DatasetQualityHistoryResponse"
        "400":
          description: dataset_id가 비어 있거나 limit이 잘못됨
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 접근 가능한 run이 없는 dataset_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /builds/{run_id}/quality:
    get:
      operationId: getBuildQuality
      summary: >-
        run의 구조화된 Quality 결과와 schema drift 조회 (#486). manifest에 저장된
        source_key별 QualityCheckResult(PASS 포함)와 SchemaDriftFinding을 그대로
        반환한다 — 로그를 파싱하지 않고 JSON으로 조회 가능하다. `availability`가
        `available`/`partial`/`unavailable`를 구분하므로, 빈 `quality_results`가
        "0건 평가"인지 "애초에 계산된 적 없음"인지 클라이언트가 판별할 수 있다(#514).
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: run의 quality_results/schema_drift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildQualityResponse"
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 해당 run의 소유자가 아님
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /query:
    post:
      operationId: queryBuiltDataset
      summary: 서버가 resolve한 Silver/Gold table에 read-only SQL 실행
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: bounded query result preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
        "400":
          description: invalid context, unsafe SQL, syntax/execution failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: query context 소유권 위반
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: stage artifact unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: query 전용 capacity 포화. child process는 생성되지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: query process timeout 및 강제 종료
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        서버에 KPUBDATA_BUILDER_API_KEY가 설정된 경우 필수. 미설정 시(로컬 개발 기본값)
        인증 없이 모든 요청이 허용된다 (#248).
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Google OIDC ID 토큰 (ADR 0009). Authorization: Bearer <jwt>.
        OIDC_ISSUER 미설정 시 비활성 — 기존 ApiKeyAuth 배포에 영향 없음 (#385).

  responses:
    Unauthorized:
      description: X-API-Key가 누락되었거나 서버에 설정된 키와 일치하지 않음
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      description: build 실행 식별자(경로 안전한 단일 세그먼트)
      schema:
        type: string

    DatasetId:
      name: dataset_id
      in: path
      required: true
      description: >-
        BuildSpec.dataset_id 값. slash/space 등 경로에 그대로 쓸 수 없는 문자를
        포함할 수 있으므로 클라이언트는 percent-encoding해야 한다(#488).
      schema:
        type: string

    Stage:
      name: stage
      in: path
      required: true
      description: 조회할 medallion stage
      schema:
        type: string
        enum: [bronze, silver, gold]

    ProviderName:
      name: provider
      in: path
      required: true
      description: kpubdata runtime catalog에 등록된 Provider 식별자
      schema:
        type: string
        pattern: "^[a-z0-9][a-z0-9_-]{0,63}$"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 사람이 읽는 오류 요약 메시지
        code:
          type: string
          description: 클라이언트 분기용 안정적인 오류 코드(새 endpoint에서 사용)

    QueryRequest:
      type: object
      additionalProperties: false
      required: [dataset_id, run_id, stage, sql]
      properties:
        dataset_id: {type: string}
        run_id: {type: string}
        stage: {type: string, enum: [silver, gold]}
        source: {type: string}
        sql: {type: string, maxLength: 65536}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}

    QueryResponse:
      type: object
      additionalProperties: false
      required: [columns, rows, truncated, execution_ms]
      properties:
        columns:
          type: array
          items: {type: string}
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        truncated: {type: boolean}
        execution_ms: {type: integer, minimum: 0}

    ValidationError:
      type: object
      description: >-
        validate/build/preview의 spec 검증 실패 응답. SpecLoadError는
        {status:"error", error}, ValidationError는 {status:"invalid", problems}로
        나뉜다.
      required: [status]
      properties:
        status:
          type: string
          enum: [error, invalid]
        error:
          type: string
          description: status=error일 때의 파싱 오류 메시지
        problems:
          type: array
          description: status=invalid일 때의 검증 문제 목록
          items:
            type: string

    JsonValue:
      description: 표준 JSON으로 직렬화 가능한 값(null, scalar, array, object)
      type: [string, number, boolean, object, array, "null"]
      additionalProperties:
        $ref: "#/components/schemas/JsonValue"
      items:
        $ref: "#/components/schemas/JsonValue"

    BuildSpec:
      type: object
      description: >-
        선언적 빌드 명세(snake_case). dataset_id/title/description/sources/exports는
        필수이고 나머지 필드는 선택이다. 세부 스키마는 spec 모델
        (spec/models.py)을 따른다. 제거된 transforms/normalization_mode 필드는
        허용하지 않는다.
      additionalProperties: true
      allOf:
        - not:
            required: [transforms]
        - not:
            required: [normalization_mode]
      required: [dataset_id, title, description, sources, exports]
      properties:
        dataset_id:
          type: string
        title:
          type: string
        description:
          type: string
        sources:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/SourceRef"
        exports:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ExportTarget"
        metadata:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        publish:
          type: boolean
          default: false
        splits:
          oneOf:
            - $ref: "#/components/schemas/SplitSpec"
            - type: "null"
        pii:
          oneOf:
            - $ref: "#/components/schemas/PiiPolicy"
            - type: "null"
        license:
          type: [string, "null"]
        quality:
          oneOf:
            - $ref: "#/components/schemas/QualityPolicy"
            - type: "null"

    SourceRef:
      type: object
      description: >-
        kpubdata provider/dataset 참조. 제거된 normalization_mode 필드는 허용하지
        않으며 정규화와 검증은 schema 계약으로 선언한다.
      additionalProperties: true
      not:
        required: [normalization_mode]
      required: [provider, dataset]
      properties:
        provider:
          type: string
        dataset:
          type: string
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"
        alias:
          type: string
          default: ""
        schema:
          oneOf:
            - $ref: "#/components/schemas/SchemaContract"
            - type: "null"

    SchemaContract:
      type: object
      description: Silver 정규화 및 required-column/dtype 검증 계약
      properties:
        required:
          type: array
          items:
            type: string
          default: []
        dtypes:
          type: object
          additionalProperties:
            type: string
          default: {}
        casts:
          type: object
          additionalProperties:
            type: string
          default: {}

    ExportTarget:
      type: object
      required: [kind, output_path]
      properties:
        kind:
          type: string
        output_path:
          type: string
        options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/JsonValue"

    SplitSpec:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [ratio, key]
        ratios:
          type: object
          additionalProperties:
            type: number
          default: {}
        key:
          type: string
          default: ""
        seed:
          type: integer
          default: 0

    PiiPolicy:
      type: object
      properties:
        mode:
          type: string
          enum: [block, warn, allow]
          default: block
        allow_columns:
          type: array
          items:
            type: string
          default: []

    QualitySeverity:
      type: string
      description: >-
        quality rule 위반 시 심각도 (#486). "warn"(기본, Build 계속 진행) |
        "fail"(Gold 진입 전 소스 실패).
      enum: [warn, fail]
      default: warn

    QualityRangeRule:
      type: object
      description: >-
        숫자 컬럼의 최소/최대 범위 규칙 (#486). min/max는 포함(inclusive) 경계이며
        자유형 eval을 쓰지 않는 typed rule이다. null 값은 위반으로 계산하지 않는다.
      required: [column]
      properties:
        column:
          type: string
        min:
          type: [number, "null"]
        max:
          type: [number, "null"]
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityCompareColumnsRule:
      type: object
      description: >-
        두 컬럼 간 비교 규칙 (#486). operator는 제한된 어휘만 허용하며 자유형
        expression/eval을 쓰지 않는다. 두 컬럼 모두 null이 아닌 행만 평가한다.
      required: [left, operator, right]
      properties:
        left:
          type: string
        operator:
          type: string
          enum: [eq, ne, gt, gte, lt, lte]
        right:
          type: string
        severity:
          $ref: "#/components/schemas/QualitySeverity"

    QualityPolicy:
      type: object
      description: >-
        데이터 품질 임계 정책. max_duplicate_rate/max_null_ratio/min_rows(#446)는
        기존 syntax와 100% 하위 호환이며 기본 severity는 "warn"이다. 대응하는
        ``*_severity`` 필드(#486)로 명시적 FAIL을 선언할 수 있다.
      properties:
        max_duplicate_rate:
          type: [number, "null"]
        max_duplicate_rate_severity:
          $ref: "#/components/schemas/QualitySeverity"
        max_null_ratio:
          type: object
          additionalProperties:
            type: number
          default: {}
        max_null_ratio_severity:
          type: object
          description: 컬럼별 max_null_ratio severity override. 선언 안 된 컬럼은 "warn".
          additionalProperties:
            $ref: "#/components/schemas/QualitySeverity"
          default: {}
        min_rows:
          type: [integer, "null"]
        min_rows_severity:
          $ref: "#/components/schemas/QualitySeverity"
        range:
          type: array
          items:
            $ref: "#/components/schemas/QualityRangeRule"
          default: []
        compare_columns:
          type: array
          items:
            $ref: "#/components/schemas/QualityCompareColumnsRule"
          default: []

    SpecRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열

    PreviewRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        limit:
          type: integer
          minimum: 1
          default: 5

    BuildRequest:
      type: object
      required: [spec]
      properties:
        spec:
          type: string
          description: BuildSpec을 YAML로 직렬화한 문자열
        run_id:
          type: string
          description: 명시 시 비어있지 않은 경로 안전한 단일 세그먼트여야 한다

    VersionResponse:
      type: object
      required: [service, api_version]
      properties:
        service:
          type: string
        api_version:
          type: string

    HealthResponse:
      type: object
      required: [status]
      description: liveness probe 응답 (버전·메타 정보 없이 status만, #372)
      properties:
        status:
          type: string
          const: "ok"

    CatalogResponse:
      type: object
      required: [providers]
      description: provider/dataset 카탈로그 (#416, BL2)
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProvider"

    CatalogProvider:
      type: object
      required: [name, datasets]
      properties:
        name:
          type: string
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/CatalogDataset"

    CatalogDataset:
      type: object
      required: [name, title, requires_service_key]
      properties:
        name:
          type: string
        title:
          type: string
        requires_service_key:
          type: boolean

    ProviderListResponse:
      type: object
      required: [providers]
      additionalProperties: false
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderSummary"

    ProviderSummary:
      type: object
      required: [provider, requires_credential, configured]
      additionalProperties: false
      properties:
        provider:
          type: string
        requires_credential:
          type: boolean
        configured:
          type: boolean
          description: user credential, server default, 또는 무인증 Provider이면 true

    ProviderCredentialPutRequest:
      type: object
      required: [credential]
      additionalProperties: false
      properties:
        credential:
          type: string
          minLength: 1
          writeOnly: true
          description: 저장할 raw credential. 응답, 로그, manifest, event에 포함하지 않는다.

    ProviderCredentialMetadata:
      type: object
      required: [provider, configured, masked, updated_at]
      additionalProperties: false
      description: owner_id와 credential 원문을 포함하지 않는 사용자별 저장 메타데이터
      properties:
        provider:
          type: string
        configured:
          type: boolean
        masked:
          type: [string, "null"]
          description: 설정 시 고정 마스크. credential 일부도 노출하지 않는다.
        updated_at:
          type: [string, "null"]
          format: date-time

    ProviderTestResponse:
      type: object
      required: [provider, status, configured, latency_ms, checked_at]
      additionalProperties: false
      properties:
        provider:
          type: string
        status:
          type: string
          enum: [connected, failed, not_configured]
        configured:
          type: boolean
        latency_ms:
          type: integer
          minimum: 0
        checked_at:
          type: string
          format: date-time
        error_category:
          type: string
          enum: [auth, network, timeout, provider, unknown]
        response_code:
          type: integer
          minimum: 100
          maximum: 599
          description: kpubdata가 구조적으로 신뢰 가능한 status를 제공한 경우에만 포함

    StructuredProblem:
      type: object
      required: [code, path, message]
      description: 구조화된 검증 문제 (#417, BL3)
      properties:
        code:
          type: string
        path:
          type: string
        message:
          type: string
        hint:
          type: string
          nullable: true

    ValidateResponse:
      type: object
      required: [status, dataset_id, api_version]
      properties:
        status:
          type: string
          enum: [valid]
        dataset_id:
          type: string
        api_version:
          type: string

    PreviewResponse:
      type: object
      required: [dataset_id, previews]
      properties:
        dataset_id:
          type: string
        previews:
          type: array
          items:
            $ref: "#/components/schemas/SourcePreview"

    SourcePreview:
      type: object
      required:
        - source_key
        - status
        - error
        - schema
        - sample
        - total_rows
        - statistics
        - quality_results
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        error:
          type: [string, "null"]
        schema:
          type: array
          items:
            type: object
            required: [name, dtype, nullable, unique_count]
            properties:
              name:
                type: string
              dtype:
                type: string
              nullable:
                type: boolean
              unique_count:
                type: integer
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"
        total_rows:
          type: integer
        statistics:
          $ref: "#/components/schemas/TableStatistics"
        quality_results:
          type: array
          description: >-
            구조화된 Quality/Schema 평가 결과 (#486). Build와 동일한 evaluator
            결과이며 PASS를 포함한 실제로 평가된 check만 담는다. drift는 preview가
            워크스페이스에 아무것도 쓰지 않으므로 포함하지 않는다.
          items:
            $ref: "#/components/schemas/QualityCheckResult"

    QualityCheckResult:
      type: object
      description: 단일 quality/schema check의 구조화된 결과 (#486).
      additionalProperties: false
      required:
        - source_key
        - category
        - rule
        - column
        - status
        - actual
        - threshold
        - affected_rows
        - evaluated_rows
        - detail
      properties:
        source_key:
          type: string
        category:
          type: string
          description: >-
            check 대분류(예: duplicate, missing, row_count, schema, range,
            compare_columns).
        rule:
          type: string
          description: >-
            구체적 rule 이름(예: max_duplicate_rate, max_null_ratio, min_rows,
            required_column, dtype, range, compare_columns).
        column:
          type: [string, "null"]
          description: >-
            관련 컬럼명. 테이블 전체 규칙이면 null. compare_columns는
            "{left},{right}" 형식의 합성값을 쓴다.
        status:
          type: string
          enum: [pass, warn, fail]
        actual:
          $ref: "#/components/schemas/JsonValue"
        threshold:
          $ref: "#/components/schemas/JsonValue"
          description: >-
            원래 규칙의 비교 조건. 기존 비율/행 수 규칙은 numeric 값을 유지한다.
            range는 {min, max}, compare_columns는 {operator, right_column} 구조다.
        affected_rows:
          type: [integer, "null"]
          description: 위반 행 수. 정확히 셀 수 없으면 null(임의 추정 금지).
        evaluated_rows:
          type: [integer, "null"]
          description: 실제 평가에 사용된 행 수. 의미 없으면 null.
        detail:
          type: [string, "null"]
          description: >-
            평가 불가 이유 등 사용자가 이해할 수 있는 결정적 설명. 정상 평가 결과는
            null이며 내부 예외·스택 트레이스·절대 경로를 포함하지 않는다.

    SchemaDriftFinding:
      type: object
      description: >-
        구조화된 schema drift 관찰 (#445, #486). deterministic 감지 결과이며
        PASS/WARN/FAIL 게이트에는 관여하지 않는다(참고용).
      additionalProperties: false
      required: [kind, column, detail]
      properties:
        kind:
          type: string
          enum: [column_added, column_removed, dtype_changed, row_count_jump]
        column:
          type: [string, "null"]
        detail:
          type: string

    BuildQualityResponse:
      type: object
      description: >-
        run의 구조화된 quality_results/schema_drift 조회 응답 (#486). `availability`와
        `evaluated_checks`는 빈 `quality_results`가 "0건 평가"인지 "애초에 계산된 적
        없음"(legacy/partial run)인지 구분한다(#514).
      required: [run_id, availability, evaluated_checks, quality_results, schema_drift]
      properties:
        run_id:
          type: string
        availability:
          type: string
          enum: [available, partial, unavailable]
          description: >-
            available: 이 run이 시도한 모든 source의 quality 결과가 있다(0건일 수
            있음). partial: 일부 source만 있다(예: 한 source의 Silver 실패).
            unavailable: 결과가 전혀 없다 — quality_results 필드 자체가 없는 legacy
            run(#486 이전)뿐 아니라, 필드는 있지만(`{}`) 시도한 source 중 하나도
            결과가 없는 새 run도 포함한다(예: 모든 source가 quality 단계 진입 전에
            실패).
        evaluated_checks:
          type: integer
          minimum: 0
          description: quality_results 전체에서 실제로 평가된 check(PASS/WARN/FAIL) 총합.
        quality_results:
          type: object
          description: source_key → QualityCheckResult 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"

    DatasetQualityHistoryEntry:
      type: object
      description: >-
        단일 run의 quality PASS/WARN/FAIL 집계 (#486). evaluated_checks==0이면
        rule_pass_rate는 반드시 null이다(미평가를 100%로 위장하지 않는다).
      required:
        - run_id
        - timestamp
        - status
        - pass_count
        - warn_count
        - fail_count
        - evaluated_checks
        - rule_pass_rate
        - validated_rows
      properties:
        run_id:
          type: string
        timestamp:
          type: [string, "null"]
          description: finished_at(없으면 started_at).
        status:
          type: string
          enum: [ok, failed, cancelled]
        pass_count:
          type: integer
        warn_count:
          type: integer
        fail_count:
          type: integer
        evaluated_checks:
          type: integer
          description: pass_count + warn_count + fail_count.
        rule_pass_rate:
          type: [number, "null"]
          description: pass_count / evaluated_checks. evaluated_checks==0이면 null.
        validated_rows:
          type: [integer, "null"]
          description: >-
            run/source의 Silver row_count 합계(#488 row_counts semantics 재사용).
            evaluated_rows를 rule 수만큼 중복 합산하지 않는다.

    DatasetQualityHistoryResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          description: newest first.
          items:
            $ref: "#/components/schemas/DatasetQualityHistoryEntry"

    TableStatistics:
      type: object
      required: [row_count, null_counts, duplicate_rate]
      properties:
        row_count:
          type: integer
        null_counts:
          type: object
          additionalProperties:
            type: integer
        duplicate_rate:
          type: number

    BuildOutcome:
      type: object
      required: [source_key, status, stages_completed, error]
      properties:
        source_key:
          type: string
        status:
          type: string
          enum: [ok, failed]
        stages_completed:
          type: array
          items:
            type: string
        error:
          type: [string, "null"]

    BuildSuccessResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version]
      properties:
        status:
          type: string
          enum: [ok]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        manifest:
          type: string
          description: 기록된 manifest.json의 경로
        api_version:
          type: string

    BuildFailureResponse:
      type: object
      required: [status, run_id, outcomes, manifest, api_version, error]
      properties:
        status:
          type: string
          enum: [failed]
        run_id:
          type: string
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/BuildOutcome"
        manifest:
          type: string
          description: partial 정책으로 남은 manifest.json의 경로
        api_version:
          type: string
        error:
          type: string
          description: 첫 번째 실패 outcome의 error에서 파생된 human-readable 요약 (#226)

    ArtifactsResponse:
      type: object
      required: [run_id, files]
      properties:
        run_id:
          type: string
        files:
          type: array
          items:
            type: string
            description: run 디렉터리 기준 상대 파일 경로

    BuildManifest:
      type: object
      required: [build_id, started_at, finished_at, schema_version]
      additionalProperties: true
      properties:
        build_id:
          type: string
        started_at:
          type: string
        finished_at:
          type: string
        schema_version:
          type: string
        inputs:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        row_counts:
          type: object
          additionalProperties:
            type: integer
        inputs_fingerprint:
          type: [string, "null"]
        created_by:
          type: [string, "null"]
          description: >-
            빌드를 요청한 principal의 display/legacy 라벨(#388). 사람이 읽는
            표시용이며, ownership 판정에는 owner_id가 없는 legacy run에 한해
            하위 호환 폴백으로만 쓰인다.
        quality_results:
          type: object
          description: >-
            source_key → QualityCheckResult 목록 (#486, additive). legacy
            manifest는 이 필드가 없다 — 부재를 "미평가"로 해석해야 하며
            "전부 PASS"로 해석하면 안 된다.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/QualityCheckResult"
        schema_drift:
          type: object
          description: source_key → SchemaDriftFinding 목록 (#486, additive).
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/SchemaDriftFinding"

    BuildSpecSnapshotResponse:
      type: object
      required: [run_id, spec, spec_digest]
      additionalProperties: false
      properties:
        run_id:
          type: string
        spec:
          type: string
          description: credential 값이 redaction된 canonical YAML
        spec_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: >-
            실제 저장된 redaction 후 canonical buildspec.yaml bytes의 SHA-256.
            credential 값만 다른 spec은 같은 digest가 될 수 있다.

    BuildSummary:
      type: object
      required: [run_id, status]
      properties:
        run_id:
          type: string
          description: 빌드 실행 식별자
        status:
          type: string
          enum: [ok, failed]
          description: 빌드 상태
        started_at:
          type: [string, "null"]
          description: 빌드 시작 시각 (ISO 8601 또는 null)
        finished_at:
          type: [string, "null"]
          description: 빌드 완료 시각 (ISO 8601 또는 null)

    BuildsResponse:
      type: object
      required: [builds]
      properties:
        builds:
          type: array
          items:
            $ref: "#/components/schemas/BuildSummary"

    # ---------------------------------------------------------------------
    # Dataset Catalog / Stage Summary API (#488)
    # ---------------------------------------------------------------------

    DatasetSourceRef:
      type: object
      description: dataset의 canonical snapshot에 선언된 소스 참조 (secret 없음)
      required: [provider, dataset, alias]
      properties:
        provider:
          type: string
        dataset:
          type: string
        alias:
          type: string

    StageStatusValue:
      type: string
      description: >-
        completed(완전한 산출물 존재) / failed(manifest에 실패로 기록됨) /
        not_run(상위 단계가 끝나지 못해 시도되지 않음) / unavailable(디렉터리는
        있지만 불완전·손상됨, legacy 형식 등)
      enum: [completed, failed, not_run, unavailable]

    DatasetStageMap:
      type: object
      description: source_key → {bronze, silver, gold} 상태 맵
      additionalProperties:
        type: object
        required: [bronze, silver, gold]
        properties:
          bronze:
            $ref: "#/components/schemas/StageStatusValue"
          silver:
            $ref: "#/components/schemas/StageStatusValue"
          gold:
            $ref: "#/components/schemas/StageStatusValue"

    DatasetSummary:
      type: object
      description: >-
        동일 dataset_id를 공유하는 여러 run을 접근 가능한 latest run 기준으로
        묶은 built dataset 요약. quality는 #486의 구조화된 품질 게이트가
        선반영되지 않았으므로 항상 null이다(N/A) — 미평가를 PASS로 표시하지 않는다.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
          description: latest run의 finished_at(없으면 started_at)
        row_counts:
          type: object
          description: >-
            source_key별 Silver row_count. multi-source dataset을 단일 값으로
            축약하지 않는다.
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
          description: row_counts 값의 합계
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
          description: "#486 선반영 안 함 — 구조화된 quality 결과가 없으므로 항상 null"

    DatasetDetailResponse:
      type: object
      description: DatasetSummary와 동일한 필드에 run_count가 추가된 단일 dataset 상세 응답.
      required:
        - dataset_id
        - title
        - sources
        - latest_run_id
        - status
        - updated_at
        - row_counts
        - total_row_count
        - stages
        - quality
        - run_count
      properties:
        dataset_id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSourceRef"
        latest_run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        updated_at:
          type: [string, "null"]
        row_counts:
          type: object
          additionalProperties:
            type: integer
        total_row_count:
          type: integer
        stages:
          $ref: "#/components/schemas/DatasetStageMap"
        quality:
          type: "null"
        run_count:
          type: integer
          description: 이 principal에게 접근 가능한 이 dataset_id의 run 총 개수

    DatasetsResponse:
      type: object
      required: [datasets]
      properties:
        datasets:
          type: array
          items:
            $ref: "#/components/schemas/DatasetSummary"

    DatasetRunSummary:
      type: object
      required: [run_id, status, started_at, finished_at, spec_digest, created_by]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [ok, failed, cancelled]
        started_at:
          type: [string, "null"]
        finished_at:
          type: [string, "null"]
        spec_digest:
          type: [string, "null"]
        created_by:
          type: [string, "null"]

    DatasetRunsResponse:
      type: object
      required: [dataset_id, runs]
      properties:
        dataset_id:
          type: string
        runs:
          type: array
          items:
            $ref: "#/components/schemas/DatasetRunSummary"

    StageState:
      type: object
      required: [status, available]
      properties:
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
          description: "status == completed 의 편의 boolean"

    RunStageEntry:
      type: object
      required: [source_key, bronze, silver, gold]
      properties:
        source_key:
          type: string
        bronze:
          $ref: "#/components/schemas/StageState"
        silver:
          $ref: "#/components/schemas/StageState"
        gold:
          $ref: "#/components/schemas/StageState"

    RunStagesResponse:
      type: object
      required: [run_id, sources]
      properties:
        run_id:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/RunStageEntry"

    StageDetailResponse:
      description: >-
        실제 stage 값에 따라 Bronze/Silver/Gold 상세 응답 중 하나를 반환한다.
        모든 분기는 runtime wire response의 필드를 명시하며 raw fetch_params,
        export options, credential, 절대 filesystem 경로를 노출하지 않는다.
      required: [run_id, stage, source_key, status, available]
      oneOf:
        - $ref: "#/components/schemas/BronzeStageDetailResponse"
        - $ref: "#/components/schemas/SilverStageDetailResponse"
        - $ref: "#/components/schemas/GoldStageDetailResponse"

    BronzeStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - provider
        - dataset
        - fetched_at
        - record_count
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [bronze]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        provider:
          type: [string, "null"]
        dataset:
          type: [string, "null"]
        fetched_at:
          type: [string, "null"]
        record_count:
          type: [integer, "null"]

    SilverColumnInfo:
      type: object
      additionalProperties: false
      required: [name, dtype, nullable, unique_count]
      properties:
        name:
          type: string
        dtype:
          type: string
        nullable:
          type: boolean
        unique_count:
          type: integer

    SilverValidationProblem:
      type: object
      additionalProperties: false
      required: [code, field, message]
      properties:
        code:
          type: string
        field:
          type: [string, "null"]
        message:
          type: string

    SilverValidationResult:
      type: object
      additionalProperties: false
      required: [ok, problems]
      properties:
        ok:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/SilverValidationProblem"

    SilverStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - schema
        - statistics
        - validation
        - sample
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [silver]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        schema:
          type: array
          items:
            $ref: "#/components/schemas/SilverColumnInfo"
        statistics:
          oneOf:
            - $ref: "#/components/schemas/TableStatistics"
            - type: "null"
        validation:
          oneOf:
            - $ref: "#/components/schemas/SilverValidationResult"
            - type: "null"
        sample:
          type: array
          items:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/JsonValue"

    GoldExportSummary:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string

    GoldStageDetailResponse:
      type: object
      additionalProperties: false
      required:
        - run_id
        - stage
        - source_key
        - status
        - available
        - row_count
        - columns
        - splits
        - exports
        - sample
        - sample_available
      properties:
        run_id:
          type: string
        stage:
          type: string
          enum: [gold]
        source_key:
          type: string
        status:
          $ref: "#/components/schemas/StageStatusValue"
        available:
          type: boolean
        row_count:
          type: [integer, "null"]
        columns:
          type: array
          items:
            type: string
        splits:
          oneOf:
            - type: object
              additionalProperties:
                type: integer
            - type: "null"
        exports:
          type: array
          items:
            $ref: "#/components/schemas/GoldExportSummary"
        sample:
          type: "null"
        sample_available:
          type: boolean
          enum: [false]
