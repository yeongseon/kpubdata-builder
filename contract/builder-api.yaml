openapi: 3.1.0
info:
  title: KPubData Builder Service API
  version: "1.11.0"
  description: >-
    Builder 중심 서비스 계약. BuildSpec 검증, preview, build 실행, artifact 조회,
    계약 버전 조회를 제공한다. CLI와 HTTP service mode(#36)가 동일한 도메인 계약을
    공유한다. 본 문서는 BuilderService(service/app.py)의 dispatch 라우팅과 실제
    wire 형태를 기계 판독용(OpenAPI 3.1) 단일 소스로 고정하며, Studio 같은 소비자가
    타입 클라이언트를 생성하는 기준이 된다. v0.4에서는 동기식 build만 유지하며
    비동기/publish 엔드포인트는 제외된다(ADR 0002, #226). v1.5.0은 built dataset
    단위 조회(dataset_id로 여러 run을 grouping)와 Bronze/Silver/Gold stage
    summary/preview API를 추가했다(#488, additive). v1.6.0은 구조화된 Quality/Schema
    Drift 결과(PASS 포함 모든 evaluated check)와 dataset별 quality history/trend
    API를 추가한다(#486, additive — 기존 엔드포인트는 변경되지 않는다). `GET
    /builds/{run_id}/quality`는 `availability`(`available`/`partial`/`unavailable`)와
    `evaluated_checks`를 함께 반환해 "0건 평가"와 "애초에 계산된 적 없음"을
    구분한다(#514, additive). v1.7.0은 Silver/Gold read-only `/query`를
    추가한다(#504, additive). v1.8.0은 stable principal별 encrypted Provider
    credential CRUD와 Provider status/test API를 추가한다(#492, additive). v1.9.0은
    `/query` 응답에 child startup과 Polars engine 실행 시간을 추가한다(#523, additive).
    v1.10.0은 `POST /preview`에 Source↔Silver diff와 sample_mode(first/random)
    옵션을 추가한다(#497, additive — 기존 필드는 유지된다). `limit`의 상한(1000)을
    새로 도입해 그 이상 값을 요청하면 400을 반환한다(behavioral tightening;
    이전에는 상한이 없었다). `limit`이 행 수만 제한하므로 wide dataset에서
    `diffs` 자체가 무제한 커질 수 있어, `diffs`도 별도 상한(1000)으로 자르고
    `diff_truncated`로 명시한다 — `transform_summary`의 집계는 잘리지 않는다.
    v1.11.0은 `GET /monitoring/summary`와 `GET /monitoring/builds`를
    추가한다(#516, additive — 기존 엔드포인트는 변경되지 않는다). Studio
    Monitoring 화면을 위한 시스템/집계 observability만 다루며 Run 단위 이벤트는
    별도(#496)다. Async build queue/worker 상태는 기존
    `AsyncBuildExecutor`/`AsyncBuildJobRegistry`(#511/#513)의 read-only
    snapshot을 반영한다 — 정상 Builder runtime에서는 `availability: available`
    이며 실제 0건과 `unavailable`을 구분한다. Builder API latency는
    healthy/degraded 임계값 근거가 없어 판정 없이 raw
    `sample_count`/`p95_latency_ms`만 제공한다. 대신
    `MonitoringSummaryResponse.status`(`healthy`/`degraded`)는 required
    subsystem(`api`/`queue`/`workers`/`artifact_store`)의 availability로부터
    계산되는 deterministic aggregate이며 latency threshold는 사용하지 않는다.
    Provider 상태는 요청마다 네트워크 프로브를 유발하므로(#492) 이번
    버전에서는 응답에도, aggregate status 판정에도 포함하지 않는다.
servers:
  - url: http://localhost:8000
    description: 로컬 builder 개발 서버

security:
  - ApiKeyAuth: []
  - bearerAuth: []

paths:
  /healthz:
    get:
      operationId: healthz
      summary: 무인증 liveness probe (버전·메타 정보 없이 status만)
      security: []
      responses:
        "200":
          description: 서비스 정상
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /version:
    get:
      operationId: getVersion
      summary: Builder API 계약 버전 조회
      responses:
        "200":
          description: 서비스/계약 버전
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /catalog:
    get:
      operationId: getCatalog
      summary: provider/dataset 카탈로그 조회 (BL2, #416)
      responses:
        "200":
          description: 사용 가능한 provider와 dataset 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogResponse"
              examples:
                PublicDataCatalog:
                  summary: 인증 필요 여부를 포함한 공공데이터 카탈로그
                  value:
                    providers:
                      - name: datago
                        datasets:
                          - name: air_quality
                            title: 대기오염정보
                            requires_service_key: true
                          - name: village_fcst
                            title: 단기예보
                            requires_service_key: true
                      - name: ecos
                        datasets:
                          - name: key_statistic_list
                            title: 주요 경제지표
                            requires_service_key: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: 카탈로그 조회 실패

  /providers:
    get:
      operationId: listProviders
      summary: 런타임 Provider와 현재 principal의 configured 상태 조회
      responses:
        "200":
          description: Provider 목록. credential 원문과 owner_id는 포함하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/status:
    get:
      operationId: getProviderStatus
      summary: 현재 principal credential로 Provider 연결 상태 확인
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 연결 상태 또는 not_configured 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
              examples:
                Connected:
                  summary: 저장된 credential로 연결 성공
                  value:
                    provider: datago
                    status: connected
                    configured: true
                    latency_ms: 84
                    checked_at: "2026-08-15T09:30:00+00:00"
                NotConfigured:
                  summary: credential이 아직 설정되지 않음
                  value:
                    provider: datago
                    status: not_configured
                    configured: false
                    latency_ms: 0
                    checked_at: "2026-08-15T09:30:00+00:00"
                ProviderTimeout:
                  summary: Provider 연결 제한 시간 초과
                  value:
                    provider: datago
                    status: failed
                    configured: true
                    latency_ms: 10003
                    checked_at: "2026-08-15T09:30:10+00:00"
                    error_category: timeout
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/test:
    post:
      operationId: testProviderConnection
      summary: 현재 principal credential로 lightweight connection test 실행
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 구조화된 connection test 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderTestResponse"
              examples:
                Connected:
                  summary: lightweight 연결 시험 성공
                  value:
                    provider: datago
                    status: connected
                    configured: true
                    latency_ms: 91
                    checked_at: "2026-08-15T09:30:00+00:00"
                AuthenticationFailed:
                  summary: Provider가 credential을 거부함
                  value:
                    provider: datago
                    status: failed
                    configured: true
                    latency_ms: 72
                    checked_at: "2026-08-15T09:30:00+00:00"
                    error_category: auth
                    response_code: 401
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패

  /providers/{provider}/credential:
    get:
      operationId: getProviderCredential
      summary: 현재 principal의 저장 credential 메타데이터 조회
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: 원문을 제외한 credential 메타데이터
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialGetResponse"
              examples:
                Configured:
                  summary: credential 원문을 노출하지 않는 저장 상태
                  value:
                    configured: true
                    masked: "********"
                    updated_at: "2026-08-15T09:25:00+00:00"
                NotConfigured:
                  summary: 저장된 credential 없음
                  value:
                    configured: false
                    masked: null
                    updated_at: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패
        "503":
          description: encrypted credential store가 구성되지 않음
    put:
      operationId: putProviderCredential
      summary: 현재 principal의 Provider credential 생성 또는 교체
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCredentialPutRequest"
            examples:
              ReplaceCredential:
                summary: 문서용 placeholder credential 저장
                value:
                  credential: replace-with-your-provider-key
      responses:
        "200":
          description: 저장된 credential 메타데이터. 원문은 echo하지 않는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialMetadata"
              examples:
                Stored:
                  summary: 원문을 echo하지 않는 저장 결과
                  value:
                    provider: datago
                    configured: true
                    masked: "********"
                    updated_at: "2026-08-15T09:25:00+00:00"
        "400":
          description: credential 누락, 빈 값, 또는 허용되지 않은 필드
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패
        "503":
          description: encrypted credential store가 구성되지 않음
    delete:
      operationId: deleteProviderCredential
      summary: 현재 principal의 저장 Provider credential 삭제
      parameters:
        - $ref: "#/components/parameters/ProviderName"
      responses:
        "200":
          description: credential 삭제 완료. 존재하지 않아도 idempotent하게 성공한다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderCredentialMetadata"
              examples:
                Deleted:
                  summary: idempotent 삭제 결과
                  value:
                    provider: datago
                    configured: false
                    masked: null
                    updated_at: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: stable principal을 확인할 수 없음
        "404":
          description: 알려지지 않은 Provider
        "502":
          description: 런타임 Provider 카탈로그 조회 실패
        "503":
          description: encrypted credential store가 구성되지 않음

  /validate:
    post:
      operationId: validateSpec
      summary: BuildSpec 검증 (동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecRequest"
            examples:
              SeoulAirQuality:
                summary: 서울 대기질 BuildSpec 검증
                value:
                  spec: |
                    dataset_id: seoul-air-quality
                    title: 서울 대기질 관측
                    description: 서울 지역 측정소별 대기오염 관측 데이터
                    sources:
                      - provider: datago
                        dataset: air_quality
                        alias: air
                        params:
                          sidoName: 서울
                    exports:
                      - kind: jsonl
                        output_path: artifacts/air-quality.jsonl
      responses:
        "200":
          description: 검증 통과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateResponse"
              examples:
                ValidSpec:
                  summary: BuildSpec 검증 통과
                  value:
                    status: valid
                    dataset_id: seoul-air-quality
                    api_version: "1.8.0"
        "400":
          description: spec 파싱 실패 또는 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                MissingSources:
                  summary: 필수 sources가 없는 BuildSpec
                  value:
                    status: invalid
                    problems:
                      - sources must contain at least one source
                MalformedYaml:
                  summary: YAML 파싱 실패
                  value:
                    status: error
                    error: could not parse BuildSpec YAML
        "401":
          $ref: "#/components/responses/Unauthorized"

  /preview:
    post:
      operationId: previewBuild
      summary: 각 소스의 스키마와 샘플 행 산출 (파일 미기록, 동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
            examples:
              AirQualityPreview:
                summary: 최대 2행의 대기질 preview 요청
                value:
                  spec: |
                    dataset_id: seoul-air-quality
                    title: 서울 대기질 관측
                    description: 서울 지역 측정소별 대기오염 관측 데이터
                    sources:
                      - provider: datago
                        dataset: air_quality
                        alias: air
                    exports:
                      - kind: jsonl
                        output_path: artifacts/air-quality.jsonl
                  limit: 2
      responses:
        "200":
          description: preview 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
              examples:
                AirQualityPreview:
                  summary: 정규화된 스키마, 표본, 통계와 품질 결과
                  value:
                    dataset_id: seoul-air-quality
                    previews:
                      - source_key: air
                        status: ok
                        error: null
                        schema:
                          - name: station_name
                            dtype: String
                            nullable: false
                            unique_count: 2
                          - name: pm10_value
                            dtype: Int64
                            nullable: true
                            unique_count: 2
                        sample:
                          - station_name: 종로구
                            pm10_value: 31
                          - station_name: 중구
                            pm10_value: 28
                        total_rows: 25
                        statistics:
                          row_count: 25
                          null_counts:
                            station_name: 0
                            pm10_value: 1
                          duplicate_rate: 0.0
                        quality_results:
                          - source_key: air
                            category: row_count
                            rule: min_rows
                            column: null
                            status: pass
                            actual: 25
                            threshold: 1
                            affected_rows: null
                            evaluated_rows: null
                            detail: null
                        source_sample:
                          - station_name: 종로구
                            pm10_value: 31
                          - station_name: 중구
                            pm10_value: 28
                        sample_mode: first
                        diff_available: true
                        diffs: []
                        transform_summary:
                          changed_cells: 0
                          changed_rows: 0
                        diff_truncated: false
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, limit 타입 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
              examples:
                InvalidLimit:
                  summary: 양수가 아닌 preview limit
                  value:
                    error: "'limit' must be a positive integer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: principal credential로 Provider client를 생성할 수 없음

  /build:
    post:
      operationId: createBuild
      summary: 파이프라인 실행 및 결과 반환 (동기식)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildRequest"
            examples:
              BuildAirQuality:
                summary: 명시적인 안전한 run_id로 동기 build 실행
                value:
                  spec: |
                    dataset_id: seoul-air-quality
                    title: 서울 대기질 관측
                    description: 서울 지역 측정소별 대기오염 관측 데이터
                    sources:
                      - provider: datago
                        dataset: air_quality
                        alias: air
                    exports:
                      - kind: jsonl
                        output_path: artifacts/air-quality.jsonl
                  run_id: air-quality-20260815
      responses:
        "200":
          description: 모든 소스 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildSuccessResponse"
              examples:
                BuildCompleted:
                  summary: Bronze, Silver, Gold를 완료한 동기 build
                  value:
                    status: ok
                    run_id: air-quality-20260815
                    outcomes:
                      - source_key: air
                        status: ok
                        stages_completed: [bronze, silver, gold]
                        error: null
                    manifest: build/air-quality-20260815/manifest.json
                    api_version: "1.8.0"
        "400":
          description: 잘못된 요청(spec 누락/검증 실패, run_id 타입/경로 안전성 오류 등)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Error"
                  - $ref: "#/components/schemas/ValidationError"
              examples:
                UnsafeRunId:
                  summary: 경로 구분자를 포함한 run_id
                  value:
                    error: run_id must be a path-safe single segment
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: >-
            하나 이상의 소스 fetch/stage 실패. upstream 소스 의존 실패이며 매니페스트는
            partial 정책으로 남는다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildFailureResponse"
              examples:
                ProviderFetchFailed:
                  summary: upstream fetch 실패 후 partial manifest를 남긴 build
                  value:
                    status: failed
                    run_id: air-quality-20260815
                    outcomes:
                      - source_key: air
                        status: failed
                        stages_completed: []
                        error: provider request failed
                    manifest: build/air-quality-20260815/manifest.json
                    api_version: "1.8.0"
                    error: provider request failed

  /artifacts/{run_id}:
    get:
      operationId: listBuildArtifacts
      summary: 실행 워크스페이스의 산출물 파일 목록 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: artifact 파일 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsResponse"
              examples:
                BuildArtifacts:
                  summary: run 디렉터리 기준 상대 경로 목록
                  value:
                    run_id: air-quality-20260815
                    files:
                      - buildspec.yaml
                      - manifest.json
                      - artifacts/air-quality.jsonl
                      - silver/air/table.parquet
        "400":
          description: 경로 안전하지 않은 run_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: 해당 run을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                RunNotFound:
                  summary: 존재하지 않는 run
                  value:
                    error: "run not found: missing-run"

  /builds/{run_id}/manifest:
    get:
      operationId: getBuildManifest
      summary: 실행 워크스페이스의 manifest.json 본문 조회
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: manifest.json 본문
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildManifest"
              examples:
                CompletedManifest:
                  summary: secret과 내부 owner_id가 없는 완료 manifest
                  value:
                    build_id: air-quality-20260815
                    started_at: "2026-08-15T09:30:00+00:00"
