[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kpubdata-builder"
version = "0.1.0"
description = "Dataset artifact pipeline for KPubData — turns normalized records into publishable outputs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Yeongseon Choe" }
]
keywords = [
  "korea", "public-data", "dataset", "pipeline", "builder", "export",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  # Builder depends on the 0.5.x kpubdata API (Client.dataset(...).list, etc.).
  # The old >=0.1.0a0 floor accepted any release and broke on clean installs that
  # resolved an older kpubdata; pin to the 0.5 line until a compat policy lands (#213).
  "kpubdata>=0.5.0,<0.6",
  "cryptography>=50,<51",
  "polars>=1.0,<2",
  "pyyaml>=6.0,<7",
  "sqlglot>=30.17,<31",
  "typing_extensions>=4.5,<5",
  "urllib3>=2.7.0,<3",
]

[project.scripts]
kpubdata-builder = "kpubdata_builder.cli:main"

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9,<10",
  "mkdocs>=1.6,<2",
]
parquet = ["pyarrow>=15,<26"]
huggingface = ["huggingface-hub>=0.23,<2"]
# PyJWT 2.9+ 부터 issuer=list 지원 (#434). auth.py:_verify_bearer_token 이
# list(=여러 issuer)를 jwt.decode(issuer=...)로 넘기므로, 하한을 되돌리면
# 2.8.x 환경에서 모든 토큰이 InvalidIssuerError 로 거부된다.
auth = ["pyjwt[crypto]>=2.9,<3"]
publish = ["huggingface-hub>=0.23,<2", "xmltodict>=0.13,<2", "kaggle>=1.6,<2"]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<3",
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "types-PyYAML>=6.0",
  # Windows에서 zoneinfo가 시스템 tz 데이터베이스를 찾지 못하는 경우를
  # 대비해 tzdata wheel을 보장한다(#553). Linux에서는 no-op다.
  "tzdata>=2024.1",
  # auth extra를 dev에 포함해 CI(mypy/ruff/pytest)에서 항상 타입 체크 가능 (#385).
  "pyjwt[crypto]>=2.9,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kpubdata_builder"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
mypy_path = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.uv.sources]
kpubdata = { path = "../kpubdata", editable = true }
