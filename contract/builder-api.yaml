                    provider: datago
                    dataset: air_quality
                    fetched_at: "2026-08-15T09:30:02+00:00"
                    record_count: 25
                SilverDetail:
                  summary: persist된 bounded Silver sample
                  value:
                    run_id: air-quality-20260815
                    stage: silver
                    source_key: air
                    status: completed
                    available: true
                    row_count: 25
                    schema:
                      - name: station_name
                        dtype: String
                        nullable: false
                        unique_count: 25
                      - name: pm10_value
                        dtype: Int64
                        nullable: true
                        unique_count: 18
                    statistics:
                      row_count: 25
                      null_counts:
                        station_name: 0
                        pm10_value: 1
                      duplicate_rate: 0.0
                    validation:
                      ok: true
                      problems: []
                    sample:
                      - station_name: 종로구
                        pm10_value: 31
                      - station_name: 중구
                        pm10_value: 28
